<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Track Journey | PRATIKSHA v11.1</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --sun-orange: #FF8C00; 
            --mercury-green: #2E8B57; 
            --saturn-blue: #001F3F; 
            --cream-light: #FFFDD0; 
            --gold-accent: #D4AF37; 
        }

        body { 
            font-family: 'Inter', 'Mukta', sans-serif; 
            background-color: var(--cream-light); 
            margin: 0; padding: 20px; color: #333; 
            min-height: 100vh; overflow-x: hidden;
            position: relative;
        }

        /* ✨ कोस्मिक बैकग्राउंड एनीमेशन (यथावत सुरक्षित) */
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 200%;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, var(--sun-orange), transparent),
                radial-gradient(2px 2px at 150px 150px, var(--mercury-green), transparent);
            background-size: 300px 300px;
            animation: stars-stream 60s infinite linear;
            z-index: -1; opacity: 0.15;
        }
        @keyframes stars-stream { from { transform: translateY(0); } to { transform: translateY(-50%); } }

        .track-container { 
            max-width: 450px; margin: auto; 
            background: white; 
            padding: 35px 20px; border-radius: 40px; 
            backdrop-filter: blur(10px); 
            border: 2px solid var(--gold-accent); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
        }
        
        .status-header { text-align: center; margin-bottom: 35px; border-bottom: 2px solid var(--sun-orange); padding-bottom: 15px; }
        .status-header h2 { font-family: 'Playfair Display', serif; color: var(--saturn-blue); font-size: 1.8rem; margin: 0; }

        .back-btn { display: inline-block; margin-bottom: 25px; color: var(--mercury-green); text-decoration: none; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }

        /* 4-स्टेप्स प्रोग्रेस बार */
        .step-container { display: flex; flex-direction: column; gap: 40px; margin-top: 20px; position: relative; }
        .step { display: flex; align-items: center; gap: 20px; opacity: 0.3; transition: all 0.8s ease; font-weight: 700; color: var(--saturn-blue); }
        .step.active { opacity: 1; }

        .circle { 
            width: 45px; height: 45px; border-radius: 50%; 
            background: #eee; 
            display: flex; align-items: center; justify-content: center; 
            color: #777; font-size: 1.1rem; z-index: 1; 
            border: 2px solid #ddd; font-weight: 900;
        }
        .active .circle { background: var(--sun-orange); color: white; border-color: var(--gold-accent); box-shadow: 0 0 15px rgba(255, 140, 0, 0.4); }
        
        .line { position: absolute; left: 22.5px; top: 0; width: 3px; height: 100%; background: #eee; z-index: 0; }
        .line-progress { position: absolute; left: 22.5px; top: 0; width: 3px; background: var(--sun-orange); z-index: 0; transition: height 1s ease; }
        
        .inventory-card { background: #fdfae1; border: 1.5px dashed var(--gold-accent); border-radius: 25px; padding: 25px; margin-top: 40px; }
        .inventory-title { font-family: 'Playfair Display', serif; color: var(--saturn-blue); border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px; margin-bottom: 15px; font-weight: 900; font-size: 1.1rem; }
        #inventoryList div { margin-bottom: 12px; padding-left: 15px; border-left: 3px solid var(--mercury-green); font-size: 0.92rem; font-weight: 600; color: #444; }

        .wa-btn { width: 100%; margin-top: 30px; background: var(--mercury-green); color: white; border: none; padding: 18px; border-radius: 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .footer-blessing { text-align: center; font-size: 0.75rem; color: var(--saturn-blue); margin-top: 40px; font-weight: bold; line-height: 1.5; }
        
        #loader { text-align: center; padding: 20px; color: var(--sun-orange); font-weight: 800; display: none; }
    </style>
</head>
<body>
    <div class="stars-container"></div>
    <div class="track-container">
        <a href="index.html" class="back-btn">← मुख्य द्वार</a>
        <div class="status-header">
            <h2>शुद्धिकरण चक्र</h2>
            <div style="font-size: 0.7rem; color: var(--mercury-green); margin-top: 10px; letter-spacing: 1px; font-weight: bold;">ORDER TRACKING ID: <span id="dispMobile">...</span></div>
        </div>

        <div id="loader">✨ कोस्मिक डेटा सिंक हो रहा है...</div>

        <div class="step-container" id="stepsContent">
            <div class="line"></div>
            <div class="line-progress" id="progressLine" style="height: 0px;"></div>
            <div class="step" id="step1"><div class="circle">1</div> 🧺 पिकअप (Picked Up)</div>
            <div class="step" id="step2"><div class="circle">2</div> 🧼 प्रक्रिया (In Process)</div>
            <div class="step" id="step3"><div class="circle">3</div> ✨ तैयार (Ready)</div>
            <div class="step" id="step4"><div class="circle">4</div> ✅ डिलीवर (Delivered)</div>
        </div>

        <div class="inventory-card">
            <div class="inventory-title"> Manifest / कपड़ों की सूची</div>
            <div id="inventoryList">विवरण खोजा जा रहा है...</div>
        </div>

        <button class="wa-btn" onclick="sendToWhatsApp()">📲 स्टेटस के लिए पूछें</button>
        <div class="footer-blessing">।। ऋणानुबंध ही सेवा का आधार है ।। <br> PRATIKSHA DIGITAL v11.1 | SONU NEEL</div>
    </div>

    <script>
        // 🔱 v11.1 Cosmic Singularity Master Link
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwQzyVoyIBw9NuNzngHVmwxUxlYhd9sPTN1yUjkCDVReZ9XlaNG2fazVyth3anlC6xS/exec';
        let globalStatus = "Pickup"; 
        let globalDetails = "";

        window.onload = function() {
            const mobile = localStorage.getItem('userMobile');
            if(!mobile) {
                document.getElementById('inventoryList').innerText = "कृपया पहले लॉगिन करें।";
                return;
            }
            document.getElementById('dispMobile').innerText = mobile;
            fetchLiveStatus(mobile);
        };

        async function fetchLiveStatus(mobile) {
            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            try {
                // v11.1 इंजन से लाइव 'getMemberData' के जरिए स्टेटस और विवरण एक साथ सिंक करना
                const response = await fetch(`${scriptURL}?action=getMemberData&mobile=${mobile}`);
                const data = await response.json();

                if(data.status === "not_found") { 
                    document.getElementById('inventoryList').innerText = "अभी कोई सक्रिय ऑर्डर (Active Order) नहीं मिला।"; 
                    updateSteps("None");
                    return; 
                }

                // v11.1 डेटा सिंक
                globalStatus = data.orderStatus || "Pending";
                globalDetails = data.details || "विवरण उपलब्ध नहीं";
                
                // सूची रेंडर करना (Col E का गहरा विवरण)
                const invList = document.getElementById('inventoryList');
                invList.innerHTML = '';
                
                // विवरण को लाइनों या कोमा के हिसाब से बांटना
                const items = globalDetails.split('\n');
                items.forEach(item => { 
                    if(item.trim()) invList.innerHTML += `<div>• ${item.trim()}</div>`; 
                });
                
                updateSteps(globalStatus);

            } catch (err) {
                console.error("Sync Error:", err);
                document.getElementById('inventoryList').innerText = "कोस्मिक कनेक्शन में बाधा! कृपया रिफ्रेश करें।";
            } finally {
                loader.style.display = 'none';
            }
        }

        function updateSteps(status) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            
            // 🔱 v11.1 बेहतर स्टेटस मैपिंग
            const stepsMap = { 
                "Pending": 1, "Pickup": 1, "Order Pickup": 1, "पिकअप": 1,
                "Washing": 2, "Processing": 2, "Laundry": 2, "In Process": 2, "Process": 2,
                "Ready": 3, "Ready to Deliver": 3, "तैयार": 3,
                "Delivered": 4, "Paid": 4, "Complete": 4
            };
            
            let level = stepsMap[status] || 0;
            const progressLine = document.getElementById('progressLine');
            
            if (level === 0) {
                progressLine.style.height = "0px";
                return;
            }

            for(let i=1; i<=level; i++) { 
                const el = document.getElementById('step' + i); 
                if(el) el.classList.add('active'); 
            }

            // 4 स्टेप्स के लिए लाइन प्रोग्रेस (0, 33%, 66%, 100%)
            let heightPercent = ((level - 1) / 3) * 100;
            progressLine.style.height = `${heightPercent}%`;
        }

        function sendToWhatsApp() {
            const mobile = localStorage.getItem('userMobile');
            const msg = `*प्रतीक्षा ड्राईक्लीनर्स* ✨\nनमस्ते सोनू भाई,\n\nमेरे कपड़े अभी *${globalStatus}* स्टेज पर हैं।\nविवरण: ${globalDetails}\n\nधन्यवाद! 🙏`;
            window.open(`https://wa.me/917740870095?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
