<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>डैशबोर्ड | प्रतीक्षा डिजिटल सुप्रीम</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;700&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --pure-moon: #ffffff;
            --midnight: #000205; 
            --accent-gold: #FFD700;
            --sun-orange: #FF8C00;
            --glass-border: rgba(255, 215, 0, 0.3);
        }

        body { 
            font-family: 'Inter', 'Mukta', sans-serif; 
            background: var(--midnight); 
            margin: 0; padding: 15px;
            color: white;
            overflow-x: hidden;
        }

        .solar-system {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at center, #001a33 0%, #000205 100%);
        }

        .star-field {
            position: absolute;
            width: 200%; height: 200%;
            background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            animation: moveStars 100s linear infinite;
        }

        @keyframes moveStars { from { transform: translateY(0); } to { transform: translateY(-50%); } }

        header { text-align: center; margin-bottom: 25px; }
        .logo-ring {
            width: 70px; height: 70px;
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--accent-gold);
        }
        h1 { font-family: 'Playfair Display'; font-size: 24px; color: var(--accent-gold); margin: 0; }
        p.mission { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #aaa; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }
        .full-width { grid-column: span 2; }
        .label { font-size: 11px; color: #ccc; margin-bottom: 5px; }
        .value { font-size: 20px; font-weight: 900; color: var(--pure-moon); }
        .gold-text { color: var(--accent-gold); }

        .sip-tracker { margin-top: 25px; padding: 20px; background: rgba(255, 215, 0, 0.05); border-radius: 20px; border: 1px solid var(--glass-border); }
        .sip-title { font-family: 'Playfair Display'; color: var(--accent-gold); text-align: center; margin-bottom: 15px; font-size: 18px; }
        .progress-container { background: rgba(255,255,255,0.1); border-radius: 10px; height: 12px; margin: 10px 0; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-gold), var(--sun-orange)); transition: width 1s ease-in-out; }
        .sip-footer { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; }

        .refresh-btn {
            display: block; width: 100%; padding: 12px; margin-top: 20px;
            background: var(--accent-gold); color: black; border: none;
            border-radius: 10px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="solar-system"><div class="star-field"></div></div>

    <header>
        <div class="logo-ring">✨</div>
        <h1>PRATIKSHA DIGITAL</h1>
        <p class="mission">Mission 2047 | Pure Fabric Care</p>
    </header>

    <div class="stats-grid">
        <div class="stat-card full-width">
            <div class="label">आज की कुल कमाई (Live)</div>
            <div class="value gold-text" id="todayColl">₹ 0</div>
        </div>
        <div class="stat-card">
            <div class="label">पेंडिंग आर्डर्स</div>
            <div class="value" id="pending">0</div>
        </div>
        <div class="stat-card">
            <div class="label">धुलाई प्रक्रिया</div>
            <div class="value" id="washing">0</div>
        </div>
        <div class="stat-card">
            <div class="label">रेडी टू डिलीवर</div>
            <div class="value" id="ready">0</div>
        </div>
        <div class="stat-card">
            <div class="label">कुल एक्टिव ग्राहक</div>
            <div class="value" id="customers">0</div>
        </div>
    </div>

    <div class="sip-tracker">
        <div class="sip-title">🔱 2047 SIP संकल्प</div>
        <div class="label" id="totalColl">मासिक प्रगति: ₹ 0</div>
        <div class="progress-container"><div class="progress-bar" id="bar"></div></div>
        <div class="sip-footer">
            <span>लक्ष्य: ₹2,500/महीना</span>
            <span id="perc">0%</span>
        </div>
    </div>

    <button class="refresh-btn" onclick="fetchData()">🔄 कोस्मिक सिंक करें</button>

    <script>
        // 🔱 PRATIKSHA DIGITAL - CHITTI SUPREME v12.0 URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxtgmZnXY17c63b_3EYNNc1Xe3W6a0e6WREgz6wQwnSXvQuREJ-vLiA1AKP6k6Z9WoIlg/exec';
        const AUTH_KEY = "PRATIKSHA_2047_SECURE";

        function fetchData() {
            const btn = document.querySelector('.refresh-btn');
            btn.innerText = "🌀 सिंक हो रहा है...";
            
            fetch(`${scriptURL}?action=getDashboardData&key=${AUTH_KEY}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === "error") {
                    alert("सुरक्षा त्रुटि: " + data.message);
                    return;
                }

                // v12.0 डेटा मैपिंग - Chitti Engine Logic
                document.getElementById('todayColl').innerText = '₹ ' + (data.todayColl || 0);
                document.getElementById('pending').innerText = data.pending || 0;
                document.getElementById('washing').innerText = data.washing || 0;
                document.getElementById('ready').innerText = data.ready || 0;
                document.getElementById('customers').innerText = data.totalCust || 0;

                // 📊 Mission 2047 SIP Tracker Logic
                // चूँकि मासिक डेटा 'Billing' शीट से आ रहा है, हम 2500 का लक्ष्य मान रहे हैं
                const monthlyTarget = 2500;
                const actualMonthly = data.todayColl; // यहाँ आप monthlyTotal डेटा भी सिंक कर सकते हैं
                let progress = Math.min((actualMonthly / monthlyTarget) * 100, 100);
                
                document.getElementById('bar').style.width = progress + "%";
                document.getElementById('perc').innerText = Math.round(progress) + "%";
                document.getElementById('totalColl').innerText = 'आज का योगदान: ₹ ' + actualMonthly;
                
                btn.innerText = "🔄 कोस्मिक सिंक करें";
            })
            .catch(err => {
                console.error(err);
                btn.innerText = "🔄 कोस्मिक सिंक करें";
            });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
