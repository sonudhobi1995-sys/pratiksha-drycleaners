<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver Station | प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;600;700&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --midnight: #000205;
            --accent-gold: #FFD700;
            --sun-orange: #FF8C00;
            --glass-border: rgba(255, 215, 0, 0.3);
            --error-red: #ff4d4d;
        }

        body { 
            font-family: 'Inter', 'Mukta', sans-serif; 
            background: var(--midnight); 
            color: white; 
            margin: 0; 
            padding-bottom: 100px; 
            overflow-x: hidden;
        }

        /* मंदाकिनी (The Milky Way Layer) */
        .milky-way {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #000205 100%);
            z-index: -10;
        }

        /* एनिमेटेड तारे (Twinkling Stars Layer) */
        .stars-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -9; pointer-events: none; }
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0.5;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }

        /* सजीव सौरमंडल (Moving Solar System) */
        .solar-system {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; height: 100%; z-index: -8; pointer-events: none; opacity: 0.4;
        }
        .sun {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; background: radial-gradient(circle, #ffcc00, #ff8800, transparent);
            border-radius: 50%; box-shadow: 0 0 50px #ff8800;
        }
        .orbit {
            position: absolute; top: 50%; left: 50%; border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%; transform: translate(-50%, -50%);
            animation: rotate linear infinite;
        }
        .planet {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);
            border-radius: 50%;
        }
        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* UI एलीमेंट्स */
        .app-header { padding: 36px 15px 22px; text-align: center; border-bottom: 2px solid var(--sun-orange); backdrop-filter: blur(5px); position: relative; z-index: 10; }
        
        .card { 
            background: rgba(255, 255, 255, 0.03); 
            padding: 25px; border-radius: 35px; 
            margin: 20px 15px; 
            border: 2px solid var(--glass-border);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative; z-index: 10;
        }
        
        h3 { color: var(--accent-gold); font-family: 'Playfair Display', serif; border-bottom: 2px solid var(--sun-orange); display: inline-block; margin-bottom: 20px; letter-spacing: 1.5px; }
        label { font-size: 0.65rem; font-weight: 800; color: rgba(255,255,255,0.7); text-transform: uppercase; margin-top: 15px; display: block; letter-spacing: 1.5px; }

        input, select { 
            width: 100%; padding: 16px; margin: 8px 0 12px 0; 
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.6); color: #fff; font-size: 1rem;
            box-sizing: border-box; outline: none;
        }

        select option { background-color: #001F3F; color: white; }

        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .cat-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); padding: 12px 5px; border-radius: 15px; font-size: 0.75rem; font-weight: 800; color: white; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: var(--sun-orange); border-color: var(--sun-orange); box-shadow: 0 0 15px var(--sun-orange); }

        .btn-add { background: none; color: var(--accent-gold); width: 100%; padding: 15px; border-radius: 18px; font-weight: 800; border: 1px dashed var(--accent-gold); margin-bottom: 15px; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, var(--sun-orange), #ff4500); color: #fff; width: 100%; padding: 20px; border: none; border-radius: 20px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .btn-success { background: linear-gradient(135deg, #128C7E, #075E54); color: #fff; width: 100%; padding: 20px; border: none; border-radius: 20px; font-weight: 900; text-transform: uppercase; cursor: pointer; }

        #liveList { margin-top: 15px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 20px; border: 1px dashed var(--accent-gold); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; }
        .remove-btn { color: var(--error-red); font-weight: 900; cursor: pointer; border: 1px solid var(--error-red); padding: 4px 8px; border-radius: 8px; font-size: 0.65rem; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(0, 0, 0, 0.9); display: flex; justify-content: space-around; padding: 15px 0 25px; border-top: 1px solid var(--glass-border); z-index: 1000; backdrop-filter: blur(10px); }
        .nav-item { background: none; border: none; color: #64748b; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 5px; font-weight: 800; cursor: pointer; width: 50%; }
        .nav-item.active { color: var(--accent-gold); text-shadow: 0 0 10px var(--accent-gold); }
        .nav-item span { font-size: 1.8rem; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="milky-way"></div>
    <div class="stars-layer" id="starsContainer"></div>
    
    <div class="solar-system">
        <div class="sun"></div>
        <div class="orbit" style="width:140px; height:140px; animation-duration: 10s;"><div class="planet" style="width:6px; height:6px; background:#aaa;"></div></div>
        <div class="orbit" style="width:200px; height:200px; animation-duration: 20s;"><div class="planet" style="width:10px; height:10px; background:#e3bb76;"></div></div>
        <div class="orbit" style="width:280px; height:280px; animation-duration: 30s;"><div class="planet" style="width:11px; height:11px; background:#2271b3;"></div></div>
        <div class="orbit" style="width:360px; height:360px; animation-duration: 45s;"><div class="planet" style="width:8px; height:8px; background:#e27b58;"></div></div>
    </div>

    <div class="app-header">
        <h2 style="margin:0; font-family:'Playfair Display'; font-size: 1.35rem; letter-spacing: 1px; color: var(--accent-gold);">प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स</h2>
        <div style="font-size: 0.65rem; letter-spacing: 1.5px; color: #fff; margin-top: 6px; opacity: 0.85;">जयपुर, राजस्थान • पिकअप एवं डिलीवरी स्टेशन</div>
    </div>

    <div class="container">
        <!-- पिकअप सेक्शन -->
        <div id="pickup-sec" class="app-sec">
            <div class="card">
                <h3>🧺 नया पिकअप</h3>
                <label>ग्राहक मोबाइल</label>
                <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                    <input type="tel" id="pickMobile" placeholder="9929xxxxxx" style="margin:0; flex:1;" onchange="fetchCustomerName('pickMobile', 'pickName')">
                    <button type="button" style="padding:0 15px; border-radius:15px; border:1px solid var(--accent-gold); background:none; color:var(--accent-gold);" onclick="getContact('pickMobile', 'pickName')">👤</button>
                </div>
                <input type="text" id="pickName" placeholder="नाम..." style="color:var(--accent-gold); font-weight:bold;">
                
                <label>श्रेणी</label>
                <div class="cat-grid">
                    <button type="button" class="cat-btn" onclick="loadItems('men', this)">पुरुष</button>
                    <button type="button" class="cat-btn" onclick="loadItems('women', this)">महिला</button>
                    <button type="button" class="cat-btn" onclick="loadItems('kids', this)">बच्चे</button>
                    <button type="button" class="cat-btn" onclick="loadItems('home', this)">होम</button>
                    <button type="button" class="cat-btn" onclick="loadItems('winter', this)">विंटर</button>
                    <button type="button" class="cat-btn" onclick="loadItems('other', this)">अन्य</button>
                </div>

                <label>विवरण</label>
                <select id="serviceType">
                    <option value="सामान्य प्रेस">💨 सामान्य प्रेस</option>
                    <option value="स्टीम प्रेस">💎 स्टीम प्रेस</option>
                    <option value="धुलाई प्रेस">🧼 धुलाई प्रेस</option>
                    <option value="ड्राई क्लीनिंग">✨ ड्राई क्लीनिंग</option>
                </select>
                <select id="itemSelect"><option value="">कपड़ा चुनें...</option></select>
                
                <div style="display:flex; gap:10px;">
                    <input type="number" id="itemQty" value="1">
                    <select id="itemNote"><option value="OK">OK ✅</option><option value="दाग">दाग ⚠️</option><option value="कटा">कटा ❌</option><option value="बटन">बटन 🔘</option></select>
                </div>

                <button type="button" onclick="addToInv()" class="btn-add">+ लिस्ट में जोड़ें</button>
                <div id="liveList"><b>📋 लिस्ट:</b><div id="listContent"></div></div>
                <button type="button" class="btn-primary" style="margin-top:20px;" id="pickBtn" onclick="submitPickup()">पिकअप संपन्न करें & WhatsApp</button>
            </div>
        </div>

        <!-- डिलीवरी सेक्शन -->
        <div id="delivery-sec" class="app-sec hidden">
            <div class="card">
                <h3>🚚 डिलीवरी मिशन</h3>
                <label>मोबाइल</label>
                <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                    <input type="tel" id="delMobile" placeholder="9929xxxxxx" style="margin:0; flex:1;" onchange="fetchCustomerName('delMobile', 'delName')">
                    <button type="button" style="padding:0 15px; border-radius:15px; border:1px solid var(--accent-gold); background:none; color:var(--accent-gold);" onclick="getContact('delMobile', 'delName')">👤</button>
                </div>
                <input type="text" id="delName" placeholder="नाम" style="color:var(--accent-gold); font-weight:bold;">
                <label>राशि (₹)</label>
                <input type="number" id="amount" placeholder="0.00" style="font-size: 1.8rem; text-align: center; color: var(--sun-orange); font-weight: 900;">
                <label>माध्यम</label>
                <select id="payMode">
                    <option value="Cash">💵 Cash</option>
                    <option value="Online">📱 Online</option>
                    <option value="Wallet">💳 Wallet</option>
                </select>
                <button type="button" class="btn-success" id="delBtn" onclick="confirmDelivery()">डिलीवरी संपन्न ✅</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" id="nav-pick" onclick="switchTab('pickup-sec', 'nav-pick')"><span>🧺</span>पिकअप</div>
        <div class="nav-item" id="nav-del" onclick="switchTab('delivery-sec', 'nav-del')"><span>🚚</span>डिलीवरी</div>
    </div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx4VuHLbIRMNN68guX10VCWz5OBloN7I5NuFq-Be7EHROXAXWhczPEYxCXswgVal18Quw/exec';

    function normalizeMobile(raw) {
        return (raw || "").toString().replace(/\D/g, "").slice(-10);
    }

    function createStars() {
        const container = document.getElementById('starsContainer');
        for (let i = 0; i < 70; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            container.appendChild(star);
        }
    }
    window.onload = () => { createStars(); };

    async function getContact(mobileId, nameId) {
        if (!('contacts' in navigator) || !('ContactsManager' in window)) {
            return alert("कांटेक्ट पिकर इस ब्राउज़र या डिवाइस में उपलब्ध नहीं है। कृपया Android Chrome का उपयोग करें या नंबर सीधे टाइप करें।");
        }
        try {
            const props = ['name', 'tel'];
            const contacts = await navigator.contacts.select(props, { multiple: false });
            if (contacts && contacts.length > 0) {
                if (contacts[0].tel && contacts[0].tel.length > 0) {
                    const rawNum = normalizeMobile(contacts[0].tel[0]);
                    document.getElementById(mobileId).value = rawNum;
                    fetchCustomerName(mobileId, nameId);
                }
                if (nameId && contacts[0].name && contacts[0].name.length > 0) {
                    document.getElementById(nameId).value = contacts[0].name[0];
                }
            }
        } catch (err) {
            if (err && err.name !== 'AbortError') {
                alert("कांटेक्ट नहीं खुल सका। कृपया अनुमति जांचें या नंबर सीधे टाइप करें।");
            }
        }
    }

    async function fetchCustomerName(mobileId, nameId) {
        const mob = normalizeMobile(document.getElementById(mobileId).value);
        document.getElementById(mobileId).value = mob;
        if (mob.length < 10) return;
        try {
            const res = await fetch(`${scriptURL}?action=getMemberData&mobile=${encodeURIComponent(mob)}`);
            const data = await res.json();
            if (data.name && data.name !== "Guest") {
                document.getElementById(nameId).value = data.name;
            }
        } catch (e) { console.log("Fetch error"); }
    }

    function switchTab(secId, navId) {
        document.querySelectorAll('.app-sec').forEach(sec => sec.classList.add('hidden'));
        document.getElementById(secId).classList.remove('hidden');
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        document.getElementById(navId).classList.add('active');
    }

    const inventory = {
        men: ["शर्ट", "पेंट", "जींस", "ट्राउज़र", "टी-शर्ट", "पोलो टी-शर्ट", "सूट", "ब्लेज़र", "कोट", "कुर्ता", "पायजामा", "धोती", "शॉर्ट्स / बरमूडा", "अन्य"],
        women: ["साड़ी", "भारी साड़ी", "ब्लाउज़", "सूट सलवार", "कुर्ती", "कुर्ता सेट", "लहंगा", "दुपट्टा", "लेगिंग्स", "प्लाज़ो", "टॉप", "जींस", "गाउन / मैक्सी", "अन्य"],
        kids: ["बाबा सूट", "फ्रॉक", "टॉप", "टी-शर्ट", "शर्ट", "पेंट / निक्कर", "जींस", "स्कूल ड्रेस", "कुर्ता पायजामा", "अन्य"],
        home: ["बेड शीट", "डबल बेड शीट", "तकिया कवर", "पर्दे", "दरवाज़े के पर्दे", "कंबल", "सिंगल कंबल", "डबल कंबल", "रजाई", "कम्फ़र्टर", "तौलिया", "बाथ मैट", "कालीन / दरी", "सोफ़ा कवर", "कुशन कवर", "अन्य"],
        winter: ["जैकैट", "पफ़र जैकेट", "लेदर जैकेट", "ब्लेज़र", "ओवरकोट", "वूलन कोट", "विंडचीटर", "श्रग", "स्वेटर", "कार्डिगन", "पुलओवर", "हाई-नेक स्वेटर", "स्वेटशर्ट / हुडी", "हाफ स्वेटर", "शॉल", "पश्मीना शॉल", "कश्मीरी शॉल", "वूलन स्टोल", "मफलर", "वूलन दुपट्टा", "थर्मल टॉप", "थर्मल बॉटम", "वूलन लेगिंग्स", "वूलन कैप", "मंकी कैप", "दस्ताने", "वूलन मोज़े", "नेक वार्मर", "अन्य"],
        other: ["बैग", "स्कूल बैग", "हैंडबैग", "टोपी", "मोज़े", "रुमाल", "बेल्ट", "जूते / चप्पल", "अन्य"]
    };

    function loadItems(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const sel = document.getElementById('itemSelect');
        sel.innerHTML = '<option value="">कपड़ा चुनें</option>';
        if (inventory[cat]) {
            inventory[cat].forEach(i => { sel.innerHTML += `<option value="${i}">${i}</option>`; });
        }
    }

    let selectedItems = [];
    function addToInv() {
        const item = document.getElementById('itemSelect').value;
        const qty = parseFloat(document.getElementById('itemQty').value);
        const service = document.getElementById('serviceType').value;
        const note = document.getElementById('itemNote').value;
        if (!item || isNaN(qty) || qty <= 0) return alert("कृपया कपड़ा और मात्रा सही भरें!");
        selectedItems.push({ text: `${item} (${qty}) - ${service} [${note}]`, id: Date.now() });
        renderList();
    }

    function renderList() {
        const listDiv = document.getElementById('listContent');
        listDiv.innerHTML = '';
        selectedItems.forEach((item) => {
            listDiv.innerHTML += `
                <div class="list-item">
                    <span>• ${item.text}</span>
                    <span class="remove-btn" onclick="removeItem(${item.id})">❌ हटाएँ</span>
                </div>`;
        });
    }

    function removeItem(id) {
        selectedItems = selectedItems.filter(i => i.id !== id);
        renderList();
    }

    async function submitPickup() {
        const mobile = normalizeMobile(document.getElementById('pickMobile').value);
        const name = document.getElementById('pickName').value || "सम्मानित ग्राहक";
        const serviceFinal = document.getElementById('serviceType').value;
        if (mobile.length < 10 || selectedItems.length === 0) return alert("कृपया सही मोबाइल नंबर और कम से कम एक कपड़ा जोड़ें!");
        
        const btn = document.getElementById('pickBtn');
        btn.innerText = "सिंक हो रहा है...";
        btn.disabled = true;
        
        const details = selectedItems.map(i => i.text).join(", ");
        const formattedItems = selectedItems.map(i => `▪️ ${i.text}`).join("\n");
        const url = `${scriptURL}?action=updateStatus&mobile=${encodeURIComponent(mobile)}&name=${encodeURIComponent(name)}&status=${encodeURIComponent('Order Pickup: ' + serviceFinal)}&details=${encodeURIComponent(details)}`;

        const pickupMsg =
            `✨ *प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स* ✨\n` +
            `📍 *जयपुर, राजस्थान* | 📞 *7740870095*\n` +
            `━━━━━━━━━━━━━━━━\n\n` +
            `नमस्ते *${name} जी*,\n\n` +
            `प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स, जयपुर, राजस्थान की ओर से आपका सामान सेवा हेतु प्राप्त कर लिया गया है।\n\n` +
            `📋 *PICKUP DETAILS*\n\n` +
            `${formattedItems}\n` +
            `▪️ *Service:* ${serviceFinal}\n` +
            `▪️ *Status:* ✅ Received Successfully\n\n` +
            `━━━━━━━━━━━━━━━━\n` +
            `शुचिता • सेवा • समर्पण\n` +
            `🙏 *धन्यवाद!*\n` +
            `_प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स | जयपुर, राजस्थान_`;
        
        try {
            await fetch(url, { method: 'GET', mode: 'no-cors' });
            window.open(`https://wa.me/91${mobile}?text=${encodeURIComponent(pickupMsg)}`, '_blank');
            location.reload();
        } catch (e) {
            alert("त्रुटि! कृपया पुनः प्रयास करें।");
            btn.disabled = false;
            btn.innerText = "पिकअप संपन्न करें & WhatsApp";
        }
    }

    async function confirmDelivery() {
        const mobile = normalizeMobile(document.getElementById('delMobile').value);
        const name = document.getElementById('delName').value || "सम्मानित ग्राहक";
        const amt = parseFloat(document.getElementById('amount').value);
        const mode = document.getElementById('payMode').value;
        if (mobile.length < 10 || isNaN(amt) || amt < 0) return alert("कृपया सही मोबाइल नंबर और राशि भरें!");

        const btn = document.getElementById('delBtn');
        btn.innerText = "सिंक हो रहा है...";
        btn.disabled = true;
        
        const url = `${scriptURL}?action=addBill&mobile=${encodeURIComponent(mobile)}&name=${encodeURIComponent(name)}&amount=${encodeURIComponent(amt)}&mode=${encodeURIComponent(mode)}&details=${encodeURIComponent('Delivery Completed')}`;

        const deliveryMsg =
