<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver Station | प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ivory-canvas: #FAF7F2;
            --card-surface: #FFFFFF;
            --royal-navy: #13294B;
            --saffron-copper: #C86D2D;
            --antique-gold: #B48A2C;
            --emerald-seal: #1E6F50;
            --slate-ink: #3B4A62;
            --hairline-border: #E5DCCB;
            --soft-sand: #F3ECE0;
            --danger-crimson: #B42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Mukta', 'Inter', sans-serif;
            background-color: var(--ivory-canvas);
            background-image:
                radial-gradient(circle at 12% 10%, rgba(200, 109, 45, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 88% 85%, rgba(19, 41, 75, 0.05) 0%, transparent 45%);
            color: var(--royal-navy);
            margin: 0;
            padding-bottom: 96px;
            overflow-x: hidden;
        }

        .app-header {
            padding: 24px 16px 20px;
            text-align: center;
            background: var(--card-surface);
            border-bottom: 3px solid var(--saffron-copper);
            box-shadow: 0 4px 18px rgba(19, 41, 75, 0.05);
        }

        .org-kicker {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--saffron-copper);
            background: var(--soft-sand);
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid var(--hairline-border);
            margin-bottom: 6px;
        }

        .app-header h2 {
            margin: 0;
            font-family: 'Playfair Display', 'Mukta', serif;
            font-size: clamp(19px, 3vw, 26px);
            font-weight: 900;
            color: var(--royal-navy);
        }

        .app-header .sub-line {
            font-size: 12px;
            font-weight: 600;
            color: var(--slate-ink);
            margin-top: 6px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 8px 4px;
        }

        .card {
            background: var(--card-surface);
            padding: 24px;
            border-radius: 18px;
            margin: 18px 14px;
            border: 1px solid var(--hairline-border);
            border-top: 4px solid var(--antique-gold);
            box-shadow: 0 8px 24px rgba(19, 41, 75, 0.05);
        }

        h3 {
            color: var(--royal-navy);
            font-family: 'Playfair Display', 'Mukta', serif;
            border-bottom: 2px solid var(--saffron-copper);
            display: inline-block;
            padding-bottom: 4px;
            margin: 0 0 14px 0;
            font-size: 19px;
            font-weight: 900;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--slate-ink);
            margin-top: 14px;
            display: block;
            letter-spacing: 0.4px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 15px;
            margin: 6px 0 10px 0;
            border-radius: 12px;
            border: 1.5px solid var(--hairline-border);
            background: var(--ivory-canvas);
            color: var(--royal-navy);
            font-size: 15px;
            font-weight: 600;
            font-family: 'Mukta', 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: var(--saffron-copper);
            background: #FFFFFF;
        }

        .contact-btn {
            padding: 0 16px;
            border-radius: 12px;
            border: 1.5px solid var(--antique-gold);
            background: var(--soft-sand);
            color: var(--royal-navy);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .contact-btn:hover {
            background: var(--saffron-copper);
            border-color: var(--saffron-copper);
            color: #FFFFFF;
        }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 8px 0 16px;
        }

        .cat-btn {
            background: var(--ivory-canvas);
            border: 1.5px solid var(--hairline-border);
            padding: 11px 6px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Mukta', 'Inter', sans-serif;
            color: var(--royal-navy);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-btn.active {
            background: var(--saffron-copper);
            border-color: var(--saffron-copper);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(200, 109, 45, 0.22);
        }

        .btn-add {
            background: var(--soft-sand);
            color: var(--royal-navy);
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            font-family: 'Mukta', 'Inter', sans-serif;
            border: 1.5px dashed var(--saffron-copper);
            margin: 8px 0 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-add:hover {
            background: #EADEC9;
        }

        .btn-primary {
            background: var(--royal-navy);
            color: #FFFFFF;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Mukta', 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s ease;
            box-shadow: 0 6px 16px rgba(19, 41, 75, 0.14);
        }

        .btn-primary:hover {
            background: var(--saffron-copper);
        }

        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-success {
            background: var(--emerald-seal);
            color: #FFFFFF;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Mukta', 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s ease;
            box-shadow: 0 6px 16px rgba(30, 111, 80, 0.16);
        }

        .btn-success:hover {
            opacity: 0.92;
        }

        .btn-success:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #liveList {
            margin-top: 10px;
            background: var(--ivory-canvas);
            padding: 14px;
            border-radius: 14px;
            border: 1px dashed var(--antique-gold);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid var(--hairline-border);
            font-size: 14px;
            font-weight: 600;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .remove-btn {
            color: var(--danger-crimson);
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--danger-crimson);
            background: #FFF5F5;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
        }

        .nav-bar {
            position: fixed;
            bottom: 14px;
            left: 16px;
            right: 16px;
            max-width: 720px;
            margin: 0 auto;
            background: var(--card-surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1.5px solid var(--hairline-border);
            z-index: 1000;
            box-shadow: 0 10px 26px rgba(19, 41, 75, 0.14);
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--slate-ink);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
            font-family: 'Mukta', 'Inter', sans-serif;
            cursor: pointer;
            width: 48%;
            padding: 10px 12px;
            border-radius: 999px;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: #FFFFFF;
            background: var(--royal-navy);
        }

        .nav-item span {
            font-size: 18px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="org-kicker">प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स • जयपुर, राजस्थान</div>
        <h2>ड्राइवर स्टेशन • पिकअप व डिलीवरी</h2>
        <div class="sub-line">शुचिता • सेवा • समर्पण | MISSION 2047</div>
    </header>

    <main class="container">
        <!-- पिकअप सेक्शन -->
        <section id="pickup-sec" class="app-sec" aria-label="नया पिकअप">
            <div class="card">
                <h3>नया पिकअप</h3>
                <label>ग्राहक मोबाइल</label>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="tel" id="pickMobile" placeholder="9929xxxxxx" style="margin:0; flex:1;" onchange="fetchCustomerName('pickMobile', 'pickName')">
                    <button type="button" class="contact-btn" onclick="getContact('pickMobile', 'pickName')">संपर्क</button>
                </div>
                <input type="text" id="pickName" placeholder="ग्राहक का नाम..." style="color:#C86D2D; font-weight:700;">

                <label>श्रेणी</label>
                <div class="cat-grid">
                    <button type="button" class="cat-btn" onclick="loadItems('men', this)">पुरुष</button>
                    <button type="button" class="cat-btn" onclick="loadItems('women', this)">महिला</button>
                    <button type="button" class="cat-btn" onclick="loadItems('kids', this)">बच्चे</button>
                    <button type="button" class="cat-btn" onclick="loadItems('home', this)">होम</button>
                    <button type="button" class="cat-btn" onclick="loadItems('winter', this)">विंटर</button>
                    <button type="button" class="cat-btn" onclick="loadItems('other', this)">अन्य</button>
                </div>

                <label>विवरण व सेवा</label>
                <select id="serviceType">
                    <option value="सामान्य प्रेस">सामान्य प्रेस</option>
                    <option value="स्टीम प्रेस">स्टीम प्रेस</option>
                    <option value="धुलाई प्रेस">धुलाई प्रेस</option>
                    <option value="ड्राई क्लीनिंग">ड्राई क्लीनिंग</option>
                </select>
                <select id="itemSelect"><option value="">कपड़ा चुनें...</option></select>

                <div style="display:flex; gap:10px;">
                    <input type="number" id="itemQty" value="1" min="1">
                    <select id="itemNote">
                        <option value="OK">OK</option>
                        <option value="दाग">दाग</option>
                        <option value="कटा">कटा</option>
                        <option value="बटन">बटन</option>
                    </select>
                </div>

                <button type="button" onclick="addToInv()" class="btn-add">+ लिस्ट में जोड़ें</button>
                <div id="liveList"><b>पिकअप सूची:</b><div id="listContent"></div></div>
                <button type="button" class="btn-primary" style="margin-top:16px;" id="pickBtn" onclick="submitPickup()">पिकअप संपन्न करें व WhatsApp भेजें</button>
            </div>
        </section>

        <!-- डिलीवरी सेक्शन -->
        <section id="delivery-sec" class="app-sec hidden" aria-label="डिलीवरी स्टेशन">
            <div class="card">
                <h3>डिलीवरी स्टेशन</h3>
                <label>ग्राहक मोबाइल</label>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="tel" id="delMobile" placeholder="9929xxxxxx" style="margin:0; flex:1;" onchange="fetchCustomerName('delMobile', 'delName')">
                    <button type="button" class="contact-btn" onclick="getContact('delMobile', 'delName')">संपर्क</button>
                </div>
                <input type="text" id="delName" placeholder="ग्राहक का नाम" style="color:#C86D2D; font-weight:700;">
                <label>राशि (₹)</label>
                <input type="number" id="amount" placeholder="0.00" style="font-size: 24px; text-align: center; color: #C86D2D; font-weight: 700;">
                <label>भुगतान माध्यम</label>
                <select id="payMode">
                    <option value="Cash">Cash</option>
                    <option value="Online">Online / UPI</option>
                    <option value="Wallet">Wallet</option>
                </select>
                <button type="button" class="btn-success" id="delBtn" onclick="confirmDelivery()">डिलीवरी संपन्न करें व WhatsApp भेजें</button>
            </div>
        </section>
    </main>

    <nav class="nav-bar" aria-label="पिकअप और डिलीवरी स्विचर">
        <button type="button" class="nav-item active" id="nav-pick" onclick="switchTab('pickup-sec', 'nav-pick')"><span>🧺</span>पिकअप</button>
        <button type="button" class="nav-item" id="nav-del" onclick="switchTab('delivery-sec', 'nav-del')"><span>🚚</span>डिलीवरी</button>
    </nav>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxrvVW7RC6bxel3KVerx6AQb-Ool4BzrYAdbeQRbBXglZ7EV9N0l8uVQ-kcDJaXC__t/exec";

    function normalizeMobile(raw) {
        return (raw || "").toString().replace(/\D/g, "").slice(-10);
    }

    async function getContact(mobileId, nameId) {
        if (!('contacts' in navigator) || !('ContactsManager' in window)) {
            return alert("कांटेक्ट पिकर इस ब्राउज़र या डिवाइस में उपलब्ध नहीं है। कृपया Android Chrome का उपयोग करें या नंबर सीधे टाइप करें।");
        }
        try {
            const props = ['name', 'tel'];
            const contacts = await navigator.contacts.select(props, { multiple: false });
            if (contacts && contacts.length > 0) {
                if (contacts[0].tel && contacts[0].tel.length > 0) {
                    const rawNum = normalizeMobile(contacts[0].tel[0]);
                    document.getElementById(mobileId).value = rawNum;
                    fetchCustomerName(mobileId, nameId);
                }
                if (nameId && contacts[0].name && contacts[0].name.length > 0) {
                    document.getElementById(nameId).value = contacts[0].name[0];
                }
            }
        } catch (err) {
            if (err && err.name !== 'AbortError') {
                alert("कांटेक्ट नहीं खुल सका। कृपया अनुमति जांचें या नंबर सीधे टाइप करें।");
            }
        }
    }

    async function fetchCustomerName(mobileId, nameId) {
        const mob = normalizeMobile(document.getElementById(mobileId).value);
        document.getElementById(mobileId).value = mob;
        if (mob.length < 10) return;
        try {
            const res = await fetch(`${scriptURL}?action=getMemberData&mobile=${encodeURIComponent(mob)}`);
            const data = await res.json();
            if (data.name && data.name !== "Guest") {
                document.getElementById(nameId).value = data.name;
            }
        } catch (e) { console.log("Fetch error"); }
    }

    function switchTab(secId, navId) {
        document.querySelectorAll('.app-sec').forEach(sec => sec.classList.add('hidden'));
        document.getElementById(secId).classList.remove('hidden');
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        document.getElementById(navId).classList.add('active');
    }

    const inventory = {
        men: ["शर्ट", "पेंट", "जींस", "ट्राउज़र", "टी-शर्ट", "पोलो टी-शर्ट", "सूट", "ब्लेज़र", "कोट", "कुर्ता", "पायजामा", "धोती", "शॉर्ट्स / बरमूडा", "अन्य"],
        women: ["साड़ी", "भारी साड़ी", "ब्लाउज़", "सूट सलवार", "कुर्ती", "कुर्ता सेट", "लहंगा", "दुपट्टा", "लेगिंग्स", "प्लाज़ो", "टॉप", "जींस", "गाउन / मैक्सी", "अन्य"],
        kids: ["बाबा सूट", "फ्रॉक", "टॉप", "टी-शर्ट", "शर्ट", "पेंट / निक्कर", "जींस", "स्कूल ड्रेस", "कुर्ता पायजामा", "अन्य"],
        home: ["बेड शीट", "डबल बेड शीट", "तकिया कवर", "पर्दे", "दरवाज़े के पर्दे", "कंबल", "सिंगल कंबल", "डबल कंबल", "रजाई", "कम्फ़र्टर", "तौलिया", "बाथ मैट", "कालीन / दरी", "सोफ़ा कवर", "कुशन कवर", "अन्य"],
        winter: ["जैकैट", "पफ़र जैकेट", "लेदर जैकेट", "ब्लेज़र", "ओवरकोट", "वूलन कोट", "विंडचीटर", "श्रग", "स्वेटर", "कार्डिगन", "पुलओवर", "हाई-नेक स्वेटर", "स्वेटशर्ट / हुडी", "हाफ स्वेटर", "शॉल", "पश्मीना शॉल", "कश्मीरी शॉल", "वूलन स्टोल", "मफलर", "वूलन दुपट्टा", "थर्मल टॉप", "थर्मल बॉटम", "वूलन लेगिंग्स", "वूलन कैप", "मंकी कैप", "दस्ताने", "वूलन मोज़े", "नेक वार्मर", "अन्य"],
        other: ["बैग", "स्कूल बैग", "हैंडबैग", "टोपी", "मोज़े", "रुमाल", "बेल्ट", "जूते / चप्पल", "अन्य"]
    };

    function loadItems(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const sel = document.getElementById('itemSelect');
        sel.innerHTML = '<option value="">कपड़ा चुनें</option>';
        if (inventory[cat]) {
            inventory[cat].forEach(i => { sel.innerHTML += `<option value="${i}">${i}</option>`; });
        }
    }

    let selectedItems = [];
    function addToInv() {
        const item = document.getElementById('itemSelect').value;
        const qty = parseFloat(document.getElementById('itemQty').value);
        const service = document.getElementById('serviceType').value;
        const note = document.getElementById('itemNote').value;
        if (!item || isNaN(qty) || qty <= 0) return alert("कृपया कपड़ा और मात्रा सही भरें!");
        selectedItems.push({ text: `${item} (${qty}) - ${service} [${note}]`, id: Date.now() });
        renderList();
    }

    function renderList() {
        const listDiv = document.getElementById('listContent');
        listDiv.innerHTML = '';
        selectedItems.forEach((item) => {
            listDiv.innerHTML += `
                <div class="list-item">
                    <span>• ${item.text}</span>
                    <span class="remove-btn" onclick="removeItem(${item.id})">हटाएँ</span>
                </div>`;
        });
    }

    function removeItem(id) {
        selectedItems = selectedItems.filter(i => i.id !== id);
        renderList();
    }

    async function submitPickup() {
        const mobile = normalizeMobile(document.getElementById('pickMobile').value);
        const name = document.getElementById('pickName').value || "सम्मानित ग्राहक";
        const serviceFinal = document.getElementById('serviceType').value;
        if (mobile.length < 10 || selectedItems.length === 0) return alert("कृपया सही मोबाइल नंबर और कम से कम एक कपड़ा जोड़ें!");

        const btn = document.getElementById('pickBtn');
        btn.innerText = "सिंक हो रहा है...";
        btn.disabled = true;

        const details = selectedItems.map(i => i.text).join(", ");
        const formattedItems = selectedItems.map(i => `• ${i.text}`).join("\n");
        const url = `${scriptURL}?action=updateStatus&mobile=${encodeURIComponent(mobile)}&name=${encodeURIComponent(name)}&status=${encodeURIComponent('Order Pickup: ' + serviceFinal)}&details=${encodeURIComponent(details)}`;

        const pickupMsg =
            `*प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स*\n` +
            `जयपुर, राजस्थान | 📞 7740870095\n` +
            `━━━━━━━━━━━━━━━━\n\n` +
            `नमस्ते *${name} जी*,\n\n` +
            `प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स, जयपुर, राजस्थान की ओर से आपका सामान सेवा हेतु प्राप्त कर लिया गया है।\n\n` +
            `*PICKUP DETAILS*\n\n` +
            `${formattedItems}\n` +
            `• *Service:* ${serviceFinal}\n` +
            `• *Status:* Received Successfully\n\n` +
            `━━━━━━━━━━━━━━━━\n` +
            `शुचिता • सेवा • समर्पण\n` +
            `धन्यवाद!\n` +
