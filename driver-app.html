<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver Dispatch | PRATIKSHA DIGITAL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --deep-space: #000205;
            --pure-moon: rgba(255, 255, 255, 0.05);
            --accent-gold: #FFD700;
            --sun-orange: #FF8C00;
            --nebula-green: #2ecc71;
            --mars-red: #e74c3c;
            --glass-border: rgba(255, 215, 0, 0.3);
        }

        body { 
            font-family: 'Inter', 'Mukta', sans-serif; 
            background: var(--deep-space); 
            margin: 0; padding: 0; color: white; 
            overflow-x: hidden;
            position: relative;
        }

        /* ✨ कोस्मिक बैकग्राउंड एनिमेशन */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 200%;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 150px 150px, #fff, transparent);
            background-size: 300px 300px;
            animation: stars-stream 60s infinite linear;
            z-index: -2; opacity: 0.5;
        }

        /* 🪐 सौरमंडल */
        .solar-system {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }
        .sun {
            position: absolute; top: 50%; left: 50%;
            width: 80px; height: 80px;
            background: radial-gradient(circle, #f39c12 20%, #e67e22 60%, transparent 80%);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 50px 15px rgba(243, 156, 18, 0.4);
        }

        .driver-header { 
            background: linear-gradient(180deg, rgba(10, 25, 49, 0.9) 0%, rgba(0, 0, 0, 0.95) 100%); 
            backdrop-filter: blur(10px); padding: 30px 20px; text-align: center; 
            border-bottom: 4px solid var(--sun-orange); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .driver-header h1 { margin: 0; font-family: 'Playfair Display'; font-size: 2rem; color: var(--accent-gold); letter-spacing: 2px; }

        /* 💻 रिस्पॉन्सिव ग्रिड लेआउट */
        .container { 
            padding: 25px; max-width: 900px; margin: auto; 
            position: relative; z-index: 1; 
            display: grid; grid-template-columns: 1fr; gap: 25px;
        }

        .card { 
            background: var(--pure-moon); backdrop-filter: blur(15px);
            padding: 30px; border-radius: 25px; color: white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h3 { 
            margin: 0 0 20px; color: var(--accent-gold); 
            font-family: 'Playfair Display', serif; 
            border-bottom: 3px solid var(--sun-orange); 
            display: inline-block; font-size: 1.2rem; text-transform: uppercase;
        }

        label {
            font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.7); 
            text-transform: uppercase; display: block; margin-top: 15px; 
        }

        input, select { 
            width: 100%; padding: 16px; margin: 8px 0 15px 0; 
            border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.2); 
            background: rgba(0, 0, 0, 0.85); color: #ffffff !important; 
            font-size: 1rem; outline: none; box-sizing: border-box;
        }
        
        select option { background-color: #001F3F !important; color: #ffffff !important; padding: 12px; }
        input:focus, select:focus { border-color: var(--accent-gold); }

        .btn-dispatch { 
            background: linear-gradient(135deg, var(--accent-gold), var(--sun-orange)); 
            color: #000; width: 100%; border: none; padding: 18px; 
            border-radius: 15px; cursor: pointer; font-weight: 900; 
            text-transform: uppercase; margin-top: 15px; transition: 0.3s;
            font-size: 1rem; letter-spacing: 1px;
        }
        .btn-dispatch:hover { transform: scale(1.02); }

        .btn-nav-back {
            display: block; text-align: center; background: none;
            border: 1px solid rgba(255,255,255,0.3); color: white;
            padding: 15px; border-radius: 15px; font-weight: bold;
            text-decoration: none; margin-top: 25px; transition: 0.3s;
        }
        .btn-nav-back:hover { background: rgba(255,215,0,0.1); border-color: var(--accent-gold); }
    </style>
</head>
<body>

<div class="solar-system"><div class="sun"></div></div>

<div class="driver-header">
    <h1>DRIVER DISPATCH</h1>
    <p style="color: var(--accent-gold); margin-top: 5px; font-size: 0.85rem; letter-spacing: 1px;">PRATIKSHA DRYCLEANERS | AMBABARI - JAIPUR</p>
</div>

<div class="container">
    <div class="card">
        <h3>🚚 आर्डर प्रेषण और स्थिति अपडेट</h3>
        
        <label>ग्राहक का मोबाइल नंबर</label>
        <div style="display:flex; gap:10px;">
            <input type="tel" id="driverMobile" placeholder="9929xxxxxx" style="margin:0; flex:1;">
            <button type="button" onclick="getContact()" style="padding:0 20px; border-radius:12px; border:2px solid var(--accent-gold); background:none; color: var(--accent-gold); cursor:pointer; font-weight:bold;">👤</button>
        </div>

        <label>नया आर्डर स्टेटस</label>
        <select id="driverStatus">
            <option value="Order Pickup">🚚 पिकअप के लिए निकल रहे हैं (Pickup)</option>
            <option value="Processing">🧺 वस्त्र धुलाई प्रक्रिया में हैं (Processing)</option>
            <option value="Ready to Deliver">✨ वस्त्र तैयार हैं, डिलीवरी के लिए आउट (Ready)</option>
            <option value="Delivered">✅ सफलतापूर्वक डिलीवर्ड (Delivered)</option>
        </select>

        <label>ड्राइवर नोट / शॉर्ट रिमार्क</label>
        <input type="text" id="driverNote" placeholder="उदा: गेट पर entregue किया / सुरक्षित रखा...">

        <button class="btn-dispatch" id="dispatchBtn" onclick="updateDriverStatus()">🚀 स्टेटस सिंक और WhatsApp भेजें</button>
        
        <a href="admin-update.html" class="btn-nav-back">🔙 गार्डियन स्टेशन (Admin) पर लौटें</a>
    </div>
</div>

<script>
    // 🔱 Chitti Supreme v12.0 Script URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4VuHLbIRMNN68guX10VCWz5OBloN7I5NuFq-Be7EHROXAXWhczPEYxCXswgVal18Quw/exec";

    async function updateDriverStatus() {
        const mob = document.getElementById('driverMobile').value;
        const status = document.getElementById('driverStatus').value;
        const note = document.getElementById('driverNote').value;
        const btn = document.getElementById('dispatchBtn');

        if(!mob || mob.length < 10) return alert("कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!");

        btn.innerText = "सिंक हो रहा है...";
        btn.disabled = true;

        const syncURL = `${SCRIPT_URL}?action=updateStatus&mobile=${mob}&status=${encodeURIComponent(status)}&details=${encodeURIComponent(note || 'ड्राइवर द्वारा अपडेट')}`;

        try {
            await fetch(syncURL, { method: 'GET', mode: 'no-cors' });
            
            // WhatsApp संदेश
            let waMsg = `✨ *प्रतीक्षा ड्राईक्लीनर्स* ✨\n` +
                        `नमस्ते जी!\n` +
                        `आपके आर्डर की स्थिति अपडेट हुई है:\n\n` +
                        `📌 स्थिति: *${status}*\n` +
                        (note ? `📝 नोट: ${note}\n` : ``) +
                        `\n🙏 धन्यवाद!\n_Mission 2047 | PRATIKSHA DIGITAL_`;

            window.open(`https://wa.me/91${mob}?text=${encodeURIComponent(waMsg)}`, '_blank');
            
            alert("स्टेटस सफलतापूर्वक सिंक हो गया! ✅");
            location.reload();
        } catch (e) {
            alert("नेटवर्क त्रुटि! कृपया पुनः प्रयास करें।");
            btn.disabled = false;
            btn.innerText = "🚀 स्टेटस सिंक और WhatsApp भेजें";
        }
    }

    async function getContact() {
        if (!('contacts' in navigator)) return alert("संपर्क चुनने के लिए मोबाइल ब्राउज़र का उपयोग करें।");
        try {
            const contacts = await navigator.contacts.select(['tel'], {multiple: false});
            if (contacts.length > 0 && contacts[0].tel) {
                let rawNum = contacts[0].tel[0].replace(/\D/g, '').slice(-10);
                document.getElementById('driverMobile').value = rawNum;
            }
        } catch (err) {}
    }
</script>
</body>
</html>
