<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>प्रतीक्षा ड्राइवर स्टेशन | PRATIKSHA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;600;700&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --midnight: #010409;
            --pure-moon: #ffffff;
            --accent-gold: #FFD700;
            --sun-orange: #FF8C00;
        }

        body { 
            font-family: 'Inter', 'Mukta', sans-serif; 
            background: var(--midnight); 
            color: white; 
            margin: 0; 
            padding-bottom: 100px; 
            overflow-x: hidden;
            position: relative;
        }

        /* ✨ चलायमान सितारों का जादू */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 100px 150px, #ffd700, transparent),
                radial-gradient(2px 2px at 250px 350px, #fff, transparent);
            background-size: 300px 300px;
            z-index: -1;
            animation: starsMove 50s linear infinite;
        }

        @keyframes starsMove {
            from { transform: translateY(0); }
            to { transform: translateY(-300px); }
        }

        .app-header { padding: 25px 15px; text-align: center; }
        
        .card { 
            background: rgba(255, 255, 255, 0.98); 
            padding: 22px; border-radius: 30px; 
            margin: 0 15px 20px 15px; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            color: #000;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        h3 { color: #000; font-family: 'Playfair Display', serif; border-bottom: 3px solid var(--sun-orange); display: inline-block; margin-bottom: 15px; }

        .input-group { display: flex; gap: 10px; margin: 8px 0 12px 0; }
        .input-group input { margin: 0; flex: 1; }
        
        .btn-contact { 
            padding: 0 15px; border-radius: 12px; border: 1.5px solid var(--sun-orange); 
            background: rgba(255,140,0,0.1); color: var(--sun-orange); cursor: pointer; font-size: 1.2rem; 
        }

        label { font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-top: 10px; display: block; }

        input, select { 
            width: 100%; padding: 14px; margin: 8px 0 12px 0; 
            border-radius: 12px; border: 1.5px solid #cbd5e1; 
            background: #f1f5f9; color: #000; font-size: 1rem;
            box-sizing: border-box; font-weight: 600;
        }

        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .cat-btn { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 10px 5px; border-radius: 12px; font-size: 0.7rem; font-weight: 800; color: #475569; cursor: pointer; }
        .cat-btn.active { background: var(--sun-orange); color: white; border-color: var(--sun-orange); box-shadow: 0 4px 12px rgba(255, 140, 0, 0.4); }

        .btn-add { background: #000; color: #fff; width: 100%; padding: 15px; border-radius: 12px; font-weight: 800; border: none; margin-bottom: 10px; cursor: pointer; }
        .btn-primary { background: var(--sun-orange); color: #fff; width: 100%; padding: 18px; border: none; border-radius: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .btn-success { background: #128C7E; color: #fff; width: 100%; padding: 18px; border: none; border-radius: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; }

        #liveList { margin-top: 10px; font-size: 0.85rem; background: #f8fafc; padding: 12px; border-radius: 15px; border: 1px dashed #cbd5e1; color: #334155; min-height: 40px; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(1, 4, 9, 0.95); display: flex; justify-content: space-around; padding: 15px 0 25px; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; backdrop-filter: blur(10px); }
        .nav-item { background: none; border: none; color: #64748b; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 5px; font-weight: 700; cursor: pointer; }
        .nav-item.active { color: var(--pure-moon); }
        .nav-item span { font-size: 1.5rem; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="app-header">
        <h2 style="margin:0; font-family:'Playfair Display'; font-size: 1.5rem; letter-spacing: 2px;">PRATIKSHA LOGISTICS</h2>
    </div>

    <div class="container">
        <div id="pickup-sec" class="app-sec">
            <div class="card">
                <h3>🧺 नया पिकअप</h3>
                
                <label>ग्राहक मोबाइल</label>
                <div class="input-group">
                    <input type="tel" id="pickMobile" placeholder="9929xxxxxx">
                    <button type="button" class="btn-contact" onclick="getContact('pickMobile', 'pickName')">👤</button>
                </div>

                <label>ग्राहक का नाम</label>
                <input type="text" id="pickName" placeholder="नाम लिखें">
                
                <label>श्रेणी (Category)</label>
                <div class="cat-grid">
                    <button class="cat-btn" onclick="loadItems('men', this)">पुरुष</button>
                    <button class="cat-btn" onclick="loadItems('women', this)">महिला</button>
                    <button class="cat-btn" onclick="loadItems('kids', this)">बच्चे</button>
                    <button class="cat-btn" onclick="loadItems('home', this)">होम</button>
                    <button class="cat-btn" onclick="loadItems('winter', this)">विंटर</button>
                    <button class="cat-btn" onclick="loadItems('other', this)">अन्य</button>
                </div>

                <label>सेवा का प्रकार (Service)</label>
                <select id="serviceType">
                    <option value="प्रेस">💨 सामान्य प्रेस</option>
                    <option value="स्टीम प्रेस">💎 कीमती स्टीम प्रेस</option>
                    <option value="धुलाई प्रेस">🧼 धुलाई प्रेस</option>
                    <option value="ड्राई क्लीनिंग प्रेस">✨ ड्राई क्लीनिंग प्रेस</option>
                </select>

                <select id="itemSelect"><option value="">कपड़ा चुनें...</option></select>

                <div style="display:flex; gap:10px;">
                    <input type="number" id="itemQty" value="1" style="flex:1;">
                    <select id="itemNote" style="flex:1;"><option value="OK">OK</option><option value="दाग">दाग</option><option value="कटा">कटा</option></select>
                </div>

                <button onclick="addToInv()" class="btn-add">+ लिस्ट में जोड़ें</button>
                <div id="liveList"><b>📋 लिस्ट:</b><div id="listContent"></div></div>
                <button class="btn-primary" style="margin-top:15px;" id="pickBtn" onclick="submitPickup()">संग्रह संपन्न करें & WhatsApp</button>
            </div>
        </div>

        <div id="delivery-sec" class="app-sec hidden">
            <div class="card">
                <h3>🚚 डिलीवरी मिशन</h3>
                <label>ग्राहक मोबाइल</label>
                <div class="input-group">
                    <input type="tel" id="delMobile" placeholder="9929xxxxxx">
                    <button type="button" class="btn-contact" onclick="getContact('delMobile', 'delName')">👤</button>
                </div>
                
                <label>ग्राहक का नाम</label>
                <input type="text" id="delName" placeholder="नाम लिखें">

                <label>कुल प्राप्त राशि (₹)</label>
                <input type="number" id="amount" placeholder="0.00">

                <label>भुगतान का तरीका</label>
                <select id="payMode">
                    <option value="Cash">Cash (नकद)</option>
                    <option value="Online">Online (UPI)</option>
                    <option value="Wallet">Wallet (सदस्यता वॉलेट)</option>
                </select>
                
                <button class="btn-success" id="delBtn" onclick="confirmDelivery()">डिलीवरी संपन्न करें & WhatsApp ✅</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" id="nav-pick" onclick="switchTab('pickup-sec', 'nav-pick')"><span>🧺</span>पिकअप</div>
        <div class="nav-item" id="nav-del" onclick="switchTab('delivery-sec', 'nav-del')"><span>🚚</span>डिलीवरी</div>
    </div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzlTe0mIbSAS1xxgy3imkn3M6AoR4HkCed-XHDy2lSln2j9kA74rBYoITi2iki90qdu/exec';

    async function getContact(mobileId, nameId) {
        if (!('contacts' in navigator)) return alert("Browser Support missing!");
        try {
            const props = ['name', 'tel'];
            const contacts = await navigator.contacts.select(props, {multiple: false});
            if (contacts.length > 0) {
                let rawNum = contacts[0].tel[0].replace(/\D/g, '');
                document.getElementById(mobileId).value = rawNum.slice(-10);
                if(contacts[0].name) document.getElementById(nameId).value = contacts[0].name[0];
            }
        } catch (err) { console.log(err); }
    }

    function switchTab(secId, navId) {
        document.querySelectorAll('.app-sec').forEach(sec => sec.classList.add('hidden'));
        document.getElementById(secId).classList.remove('hidden');
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        document.getElementById(navId).classList.add('active');
        window.scrollTo(0,0);
    }

    const inventory = {
        men: ["शर्ट", "पेंट", "जींस", "टी-शर्ट", "सूट", "कोट", "कुर्ता", "पायजामा", "रेगुलर कपड़े", "अन्य (डिजाइनर)"],
        women: ["साड़ी", "भारी साड़ी", "सूट सलवार", "कुर्ती", "लहंगा", "दुपट्टा", "रेगुलर कपड़े", "अन्य (डिजाइनर)"],
        kids: ["बाबा सूट", "फ्रॉक", "निक्कर", "स्कूल ड्रेस", "रेगुलर कपड़े", "अन्य"],
        home: ["बेड शीट", "पर्दे", "कंबल", "तौलिया", "कालीन", "कुशन कवर", "अन्य"],
        winter: ["जैकैट", "स्वेटर", "कार्डिगन", "कोट", "अन्य"],
        other: ["बैग", "टोपी", "मोजे", "रुमाल", "अन्य सामान"]
    };

    function loadItems(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const sel = document.getElementById('itemSelect');
        sel.innerHTML = '<option value="">कपड़ा चुनें</option>';
        inventory[cat].forEach(i => { sel.innerHTML += `<option value="${i}">${i}</option>`; });
    }

    let selectedItems = [];
    function addToInv() {
        const item = document.getElementById('itemSelect').value;
        const qty = document.getElementById('itemQty').value;
        const service = document.getElementById('serviceType').value;
        const note = document.getElementById('itemNote').value;
        if(!item || !qty) return alert("संख्या लिखें!");
        const entry = `${item} (${qty} नग) - ${service} [${note}]`;
        selectedItems.push(entry);
        document.getElementById('listContent').innerHTML += `<div style="padding:4px 0; border-bottom:1px solid #eee;">• ${entry}</div>`;
        document.getElementById('itemQty').value = "1";
    }

    // 🧺 पिकअप लॉजिक (सुधरा हुआ WhatsApp मैसेज)
    async function submitPickup() {
        const mobile = document.getElementById('pickMobile').value;
        const name = document.getElementById('pickName').value;
        const serviceFinal = document.getElementById('serviceType').value; // चुनी हुई सर्विस
        
        if(!mobile || selectedItems.length === 0) return alert("अधूरा डेटा!");
        
        const btn = document.getElementById('pickBtn');
        btn.innerText = "प्रोसेसिंग..."; btn.disabled = true;
        const details = selectedItems.join(", ");

        // Google Sheets Update (Service के साथ)
        const url = `${scriptURL}?action=updateStatus&mobile=${mobile}&name=${encodeURIComponent(name)}&status=${encodeURIComponent(serviceFinal)}&details=${encodeURIComponent(details)}`;

        try {
            await fetch(url);
            
            // ✨ डायनामिक मैसेज - अब "Washing" गायब, जो चुना वही दिखेगा
            const msg = `*प्रतीक्षा ड्रायक्लीनर्स (पिकअप रसीद)*\n\nनमस्ते ${name},\nहमने आपके कपड़े *${serviceFinal}* के लिए पिकअप कर लिए हैं।\n\n*विवरण:* ${details}\n\nधन्यवाद!`;
            
            const waUrl = `https://wa.me/91${mobile}?text=${encodeURIComponent(msg)}`;
            alert("डेटा सेव हो गया! अब व्हाट्सएप मैसेज भेजें।");
            window.open(waUrl, '_blank');
            location.reload();
        } catch (e) { alert("नेटवर्क त्रुटि!"); btn.innerText = "संग्रह संपन्न करें"; btn.disabled = false; }
    }

    // 🚚 डिलीवरी लॉजिक
    async function confirmDelivery() {
        const mobile = document.getElementById('delMobile').value;
        const name = document.getElementById('delName').value;
        const amt = document.getElementById('amount').value;
        const mode = document.getElementById('payMode').value;
        if(!mobile || !amt) return alert("राशि और मोबाइल लिखें!");

        const btn = document.getElementById('delBtn');
        btn.innerText = "प्रोसेसिंग..."; btn.disabled = true;

        const url = `${scriptURL}?action=addBill&mobile=${mobile}&name=${encodeURIComponent(name)}&amount=${amt}&mode=${mode}`;

        try {
            await fetch(url);
            const msg = `*प्रतीक्षा ड्रायक्लीनर्स (डिलीवरी रसीद)*\n\nनमस्ते ${name},\nआपके कपड़े सफलतापूर्वक डिलीवर कर दिए गए हैं।\n\n*प्राप्त राशि:* ₹${amt}\n*भुगतान:* ${mode}\n\nधन्यवाद, फिर से सेवा का अवसर दें! ✅`;
            const waUrl = `https://wa.me/91${mobile}?text=${encodeURIComponent(msg)}`;
            
            alert("डिलीवरी डेटा सेव हो गया! अब ग्राहक को व्हाट्सएप रसीद भेजें।");
            window.open(waUrl, '_blank');
            location.reload();
        } catch (e) { alert("त्रुटि!"); btn.innerText = "डिलीवरी संपन्न करें ✅"; btn.disabled = false; }
    }
</script>
</body>
</html>
