<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Member Exclusive | Pratiksha Dry Cleaners</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --royal-gold: linear-gradient(135deg, #d4af37 0%, #f9f295 45%, #b8860b 70%, #f9f295 100%);
            --deep-space: #010103;
            --saturn-blue: #001F3F;
            --success-green: #27ae60;
            --danger-red: #e74c3c;
            --star-gold: #FFD700;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: var(--deep-space);
            color: white;
            overflow-x: hidden;
        }

        /* ✨ कोस्मिक बैकग्राउंड एनिमेशन */
        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #001F3F 0%, #010103 100%);
        }

        .header-space {
            padding: 40px 20px 20px;
            text-align: center;
        }

        /* 💳 प्रीमियम मेंबरशिप कार्ड */
        .membership-card {
            background: var(--royal-gold);
            margin: 0 20px;
            padding: 25px;
            border-radius: 20px;
            color: black;
            position: relative;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .membership-card:active { transform: scale(0.98); }

        .membership-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .card-label { font-size: 0.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; }
        .balance-amt { font-size: 2.5rem; font-weight: 900; margin: 5px 0; }
        .member-name { font-size: 1.1rem; font-weight: 700; margin-top: 15px; }

        /* 🛡️ स्टेटस और एक्शन ग्रिड */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 25px 20px;
        }

        .action-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .action-icon { font-size: 1.5rem; margin-bottom: 8px; display: block; }
        .action-label { font-size: 0.8rem; color: #ccc; }

        /* 📜 डिजिटल पासबुक सेक्शन */
        .passbook-section { padding: 0 20px 40px; }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--star-gold);
        }

        .log-container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .log-info { display: flex; flex-direction: column; }
        .log-desc { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .log-date { font-size: 0.7rem; color: #888; }
        .log-amt { font-weight: 900; }
        .plus { color: var(--success-green); }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--star-gold);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* 📱 बॉटम नेविगेशन */
        .nav-bar {
            position: fixed;
            bottom: 20px; left: 20px; right: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            height: 60px;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .nav-item { color: white; text-decoration: none; font-size: 1.2rem; opacity: 0.5; }
        .nav-item.active { opacity: 1; color: var(--star-gold); }
    </style>
</head>
<body>

    <div class="stars-container"></div>

    <div class="header-space">
        <h1 style="font-family: 'Playfair Display'; margin: 0; letter-spacing: 2px;">PRATIKSHA</h1>
        <p style="font-size: 0.6rem; letter-spacing: 4px; color: var(--star-gold); margin-top: 5px;">COSMIC EXCLUSIVE</p>
    </div>

    <div class="membership-card">
        <div class="card-label">Cosmic Wallet Balance</div>
        <div class="balance-amt">₹ <span id="uBalance">0.00</span></div>
        <div class="member-name" id="uNameDisp">नमस्ते, कोस्मिक सदस्य</div>
    </div>

    <div id="loader" class="loader">✨ कोस्मिक सिंक जारी है...</div>

    <div class="action-grid">
        <div class="action-card">
            <span class="action-icon">🚀</span>
            <span class="action-label">फास्ट ट्रैक</span>
        </div>
        <div class="action-card">
            <span class="action-icon">💎</span>
            <span class="action-label">प्रीमियम</span>
        </div>
    </div>

    <div class="passbook-section">
        <div class="section-title">
            <span>डिजिटल पासबुक</span>
            <span style="font-size: 0.7rem; color: #888; font-family: 'Inter';">LIVE</span>
        </div>
        <div id="logContainer" class="log-container">
            </div>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="tracking.html" class="nav-item">📦</a>
        <a href="#" class="nav-item active">👤</a>
        <a href="contact.html" class="nav-item">📞</a>
    </div>

    <script>
        // 🔱 v11.1 Cosmic Singularity - लाइव लिंक
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwQzyVoyIBw9NuNzngHVmwxUxlYhd9sPTN1yUjkCDVReZ9XlaNG2fazVyth3anlC6xS/exec';

        async function fetchMemberData() {
            const mobile = localStorage.getItem('userMobile');
            
            if(!mobile) {
                alert("लॉगिन सत्र समाप्त! कृपया पुनः लॉगिन करें।");
                window.location.href = "login.html";
                return;
            }

            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            try {
                // v11.1 इंजन से डेटा सिंक (action=getMemberData)
                const response = await fetch(`${scriptURL}?action=getMemberData&mobile=${mobile}`);
                const data = await response.json();
                
                if(data.status === "not_found") {
                    document.getElementById('logContainer').innerHTML = "<p style='text-align:center; padding:30px; color:#666; font-size:0.8rem;'>कोस्मिक रिकॉर्ड नहीं मिला।</p>";
                    return;
                }

                // वॉलेट और नाम अपडेट
                document.getElementById('uBalance').innerText = parseFloat(data.balance || 0).toFixed(2);
                document.getElementById('uNameDisp').innerText = "नमस्ते, " + (data.name || "कोस्मिक सदस्य");
                
                // पासबुक में लेटेस्ट आर्डर सिंक
                const details = data.details || "";
                let logHTML = '';
                
                if(details) {
                    // विवरण को सिंक फॉर्मेट में दिखाना
                    logHTML = `
                        <div class="log-item">
                            <div class="log-info">
                                <span class="log-desc">${details}</span>
                                <span class="log-date">स्थिति: ${data.orderStatus}</span>
                            </div>
                            <div class="log-amt plus">Synced</div>
                        </div>`;
                } else {
                    logHTML = '<p style="text-align:center; padding:20px; font-size:0.8rem; color:#888;">अभी कोई सक्रिय आर्डर नहीं है।</p>';
                }
                
                document.getElementById('logContainer').innerHTML = logHTML;

            } catch (e) {
                console.error("Sync Error:", e);
                document.getElementById('logContainer').innerHTML = '<p style="text-align:center; color:var(--danger-red); padding:20px; font-size:0.8rem;">कोस्मिक नेटवर्क त्रुटि!</p>';
            } finally {
                loader.style.display = 'none';
            }
        }

        window.onload = fetchMemberData;
    </script>
</body>
</html>
