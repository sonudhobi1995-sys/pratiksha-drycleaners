<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Member Exclusive | Pratiksha</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --royal-gold: linear-gradient(135deg, #d4af37 0%, #f9f295 45%, #b8860b 70%, #f9f295 100%);
            --deep-space: #010103;
            --saturn-blue: #001F3F;
            --success-green: #27ae60;
            --danger-red: #e74c3c;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--deep-space); color: white; overflow-x: hidden; }

        /* 1. विजुअल लेआउट: फ्लोटिंग गोल्डन कार्ड */
        .header-space { padding: 40px 20px 20px; text-align: center; }
        .membership-card {
            background: var(--royal-gold);
            border-radius: 20px;
            padding: 25px;
            color: #1a1a1a;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
            transform: translateZ(0);
            transition: transform 0.3s;
        }
        .membership-card:active { transform: scale(0.97); }
        .card-type { font-size: 0.7rem; font-weight: 900; letter-spacing: 3px; opacity: 0.7; }
        
        /* 2. रियल-टाइम बैलेंस डिस्प्ले */
        .balance-section { margin-top: 15px; }
        .balance-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        .balance-amt { font-size: 3.5rem; font-weight: 900; font-family: 'Inter'; letter-spacing: -2px; }

        .refresh-btn { 
            background: rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.1);
            padding: 5px 12px; border-radius: 15px; font-size: 0.7rem; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
        }

        /* 3. डिजिटल पासबुक (Transaction History) */
        .passbook-section {
            background: white;
            border-radius: 40px 40px 0 0;
            min-height: 60vh;
            padding: 30px 20px;
            color: #1a1a1a;
        }
        .passbook-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .passbook-header h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin: 0; }

        .log-list { list-style: none; padding: 0; }
        .log-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #eee;
        }
        .log-info { display: flex; flex-direction: column; }
        .log-desc { font-weight: 700; font-size: 0.95rem; }
        .log-date { font-size: 0.75rem; color: #888; font-weight: 600; }
        .log-amt { font-weight: 900; font-size: 1rem; }
        .log-amt.minus { color: var(--danger-red); }
        .log-amt.plus { color: var(--success-green); }

        /* 4. क्विक लिंक्स */
        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .action-btn { 
            padding: 15px; border-radius: 15px; text-decoration: none; text-align: center;
            font-weight: 700; font-size: 0.8rem; border: 1px solid #eee; color: var(--saturn-blue);
        }

        /* 5. लोडर */
        #loader { display: none; text-align: center; padding: 20px; color: var(--royal-gold); }
    </style>
</head>
<body>

    <div class="header-space">
        <div class="membership-card" id="memberCard">
            <div class="card-type" id="mType">PLATINUM MEMBER</div>
            <div class="balance-section">
                <div class="balance-label">Current Balance</div>
                <div class="balance-amt">₹<span id="uBalance">0.00</span></div>
                <div class="refresh-btn" onclick="fetchMemberData()">🔄 Tap to Refresh</div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 25px; align-items: flex-end;">
                <div id="uNameDisp" style="font-weight: 800; font-size: 1.1rem; text-transform: uppercase;">...</div>
                <div id="uExpiry" style="font-size: 0.6rem; font-weight: 700; text-align: right;">VALID THRU<br>--/--</div>
            </div>
        </div>
    </div>

    <div class="passbook-section">
        <div class="passbook-header">
            <h2>Digital Passbook</h2>
            <div style="font-size: 0.7rem; font-weight: 800; color: var(--saturn-blue);">LIVE FEED</div>
        </div>

        <div id="loader">कनेक्ट हो रहा है...</div>
        <div id="logContainer" class="log-list">
            </div>

        <div class="quick-actions">
            <a href="https://wa.me/7740870095" class="action-btn">💬 Support</a>
            <a href="services.html" class="action-btn" style="background: var(--saturn-blue); color: white;">🧺 New Order</a>
        </div>
        
        <p style="text-align: center; font-size: 0.6rem; color: #ccc; margin-top: 40px;">
            © 2026 PRATIKSHA DRYCLEANERS | Your Spiritual Fabric Guardian
        </p>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxD3DOpl3cCCV1HWlZnlsp_n9ERHSH4i0I02cHt3X0PFPIp6tjzQrdVnEtn5RzCPKZL/exec';

        async function fetchMemberData() {
            const mobile = localStorage.getItem('userMobile');
            const loader = document.getElementById('loader');
            if(!mobile) return;

            loader.style.display = 'block';
            try {
                const response = await fetch(`${scriptURL}?action=getMemberDetails&mobile=${mobile}`);
                const data = await response.json();
                
                // डेटा अपडेट
                document.getElementById('uBalance').innerText = data.balance;
                document.getElementById('uNameDisp').innerText = data.name || localStorage.getItem('userName');
                document.getElementById('mType').innerText = data.membershipType || "GOLD MEMBER";
                document.getElementById('uExpiry').innerText = `VALID THRU\n${data.expiry || '12/26'}`;
                
                // ट्रांजैक्शन लॉग (कॉलम M से)
                const logs = data.transactionLog ? data.transactionLog.split('\n') : [];
                let logHTML = '';
                
                logs.forEach(log => {
                    if(log.trim()) {
                        const isMinus = log.includes('-');
                        const amtClass = isMinus ? 'minus' : 'plus';
                        const symbol = isMinus ? '' : '+';
                        
                        logHTML += `
                            <div class="log-item">
                                <div class="log-info">
                                    <span class="log-desc">${log.split('|')[1] || log}</span>
                                    <span class="log-date">${log.split('|')[0] || ''}</span>
                                </div>
                                <div class="log-amt ${amtClass}">${log.match(/-?₹?\d+/)}</div>
                            </div>`;
                    }
                });
                document.getElementById('logContainer').innerHTML = logHTML || '<p style="text-align:center; padding:20px;">अभी कोई ट्रांजैक्शन नहीं है।</p>';

            } catch (e) {
                console.error("Error!", e);
            } finally {
                loader.style.display = 'none';
            }
        }

        window.onload = fetchMemberData;
    </script>
</body>
</html>
