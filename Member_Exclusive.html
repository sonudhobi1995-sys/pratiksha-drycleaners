<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Member Exclusive | Pratiksha Drycleaners</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --moonlight: #e0e0e0;
            --star-gold: #FFD700;
            --midnight-blue: #020617;
            --saturn-ring: rgba(255, 215, 0, 0.2);
        }

        body {
            font-family: 'Inter', 'Mukta', sans-serif;
            background-color: var(--midnight-blue);
            color: var(--moonlight);
            margin: 0;
            background-image: radial-gradient(circle at 50% 10%, rgba(255,255,255,0.05) 0%, transparent 50%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container { padding: 20px; width: 100%; max-width: 450px; }

        .branding { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .branding h1 { font-family: 'Playfair Display', serif; color: var(--star-gold); letter-spacing: 4px; margin: 0; }
        .branding p { font-size: 0.6rem; letter-spacing: 2px; opacity: 0.7; text-transform: uppercase; }

        .card { 
            background: rgba(255, 255, 255, 0.04); 
            padding: 25px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(12px); text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .wallet-icon { font-size: 3rem; color: var(--star-gold); margin-bottom: 15px; }

        input { 
            width: 100%; padding: 16px; margin: 15px 0; border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); 
            color: white; box-sizing: border-box; font-size: 1.1rem; text-align: center;
        }

        .btn-check { 
            width: 100%; padding: 18px; border: none; border-radius: 20px; 
            font-weight: 700; background: linear-gradient(135deg, #FFD700, #FFA500); 
            color: #000; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
        }

        /* Result Section */
        #resultArea { display: none; margin-top: 25px; animation: fadeIn 0.5s; }
        
        .balance-box {
            background: rgba(212, 175, 55, 0.1); border: 1px solid var(--star-gold);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
        }

        .history-list { text-align: left; font-size: 0.8rem; max-height: 250px; overflow-y: auto; }
        .history-item { 
            display: flex; justify-content: space-between; padding: 10px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="branding">
        <h1>PRATIKSHA</h1>
        <p>Exclusive Member Wallet</p>
    </div>

    <div class="card">
        <i class="fas fa-wallet wallet-icon"></i>
        <h3 style="margin:0; font-family:'Playfair Display';">प्रीमियम वॉलेट लॉगिन</h3>
        <p style="font-size: 0.75rem; opacity: 0.7;">अपना रजिस्टर्ड मोबाइल नंबर दर्ज करें</p>
        
        <input type="tel" id="mobileInput" placeholder="98XXXXXXXX" maxlength="10">
        <button class="btn-check" onclick="checkWallet()">खाता देखें</button>

        <div id="resultArea">
            <div class="balance-box">
                <span style="font-size: 0.8rem; opacity: 0.8;">उपलब्ध शेष राशि</span>
                <h2 id="balanceAmount" style="margin: 5px 0; font-size: 2.5rem; color: var(--star-gold);">₹0.00</h2>
                <div id="lowBalMsg" style="color: #ff4d4d; font-size: 0.7rem; display: none; font-weight: bold;">⚠️ लो बैलेंस! कृपया रिचार्ज करें</div>
            </div>

            <div style="text-align: left; padding-left: 5px; margin-bottom: 10px;">
                <span style="font-size: 0.7rem; color: var(--star-gold); text-transform: uppercase; letter-spacing: 1px;">लेन-देन का इतिहास (History)</span>
            </div>
            
            <div class="history-list" id="historyContent">
                </div>
        </div>
    </div>

    <div style="text-align: center; font-size: 9px; color: #4b5563; margin-top: 40px; letter-spacing: 2px;">
        ।। प्रतीक्षा एवं नीति हेतु ।। <br>
        सत्यता • शुचिता • सेवा © 2026
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec'; // अपना Google Script URL यहाँ डालें

    async function checkWallet() {
        const mobile = document.getElementById('mobileInput').value;
        const resultArea = document.getElementById('resultArea');
        const balanceTxt = document.getElementById('balanceAmount');

        if(mobile.length < 10) return alert("सही मोबाइल नंबर दर्ज करें");

        balanceTxt.innerText = "खोज रहे हैं...";
        resultArea.style.display = 'block';

        try {
            // Google Sheet से डेटा लाने का लॉजिक
            const response = await fetch(`${scriptURL}?action=getWallet&mobile=${mobile}`);
            const data = await response.json();

            if(data.success) {
                balanceTxt.innerText = `₹${data.balance}`;
                document.getElementById('historyContent').innerHTML = data.historyHTML;
                
                // लो बैलेंस अलर्ट
                if(data.balance < 200) document.getElementById('lowBalMsg').style.display = 'block';
                else document.getElementById('lowBalMsg').style.display = 'none';
                
            } else {
                alert("यह नंबर मेंबरशिप में पंजीकृत नहीं है।");
                resultArea.style.display = 'none';
            }
        } catch (e) {
            console.error("Error!", e);
            balanceTxt.innerText = "Error";
        }
    }
</script>

</body>
</html>
