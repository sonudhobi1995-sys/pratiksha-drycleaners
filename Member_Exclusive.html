<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Membership | Pratiksha</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --space-dark: #010103;
            --saturn-blue: #001F3F;
            --sun-orange: #FF8C00;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; 
            background: var(--space-dark); 
            color: white; 
            overflow-x: hidden;
        }

        /* प्रीमियम हैडर */
        .exclusive-header {
            padding: 40px 20px;
            text-align: center;
            background: radial-gradient(circle at top, #1a1a2e, #010103);
        }

        .exclusive-header h1 {
            font-family: 'Playfair Display', serif;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 2px;
        }

        /* गोल्डन वॉलेट कार्ड */
        .wallet-card {
            width: 85%;
            margin: -20px auto 30px;
            background: var(--gold-gradient);
            border-radius: 20px;
            padding: 25px;
            color: #1a1a1a;
            box-shadow: 0 15px 35px rgba(191, 149, 63, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .wallet-card:active { transform: scale(0.98); }

        .wallet-card::before {
            content: ""; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: rgba(255,255,255,0.1);
            transform: rotate(45deg); pointer-events: none;
        }

        .chip { width: 45px; height: 35px; background: rgba(0,0,0,0.1); border-radius: 5px; margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.2); }
        .balance-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; opacity: 0.7; }
        .balance-amt { font-size: 2.8rem; font-weight: 900; margin: 5px 0; font-family: 'Inter'; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; }
        .member-name { font-size: 1.1rem; font-weight: 700; text-transform: uppercase; }
        .expiry { font-size: 0.7rem; font-weight: 600; }

        /* ट्रांजैक्शन हिस्ट्री */
        .history-section {
            background: white;
            border-radius: 40px 40px 0 0;
            padding: 30px 20px 100px;
            min-height: 50vh;
            color: #333;
        }

        .history-title {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;
        }

        .history-title h2 { font-size: 1.2rem; margin: 0; color: var(--saturn-blue); }

        .log-list { list-style: none; padding: 0; margin: 0; }
        .log-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 5px solid #BF953F;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .log-icon { font-size: 1.5rem; }
        .log-details { flex-grow: 1; }
        .log-date { font-size: 0.7rem; color: #888; font-weight: 700; }
        .log-desc { font-size: 0.9rem; font-weight: 600; color: #444; }
        .log-amt { font-weight: 800; color: #d32f2f; }
        .log-amt.plus { color: #2e7d32; }

        /* बैक बटन */
        .back-btn {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: var(--saturn-blue); color: white; padding: 15px 40px;
            border-radius: 30px; text-decoration: none; font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 100;
        }
    </style>
</head>
<body>

    <div class="exclusive-header">
        <h1>PREMIUM HUB</h1>
        <p style="color: #888; font-size: 0.8rem;">आपकी शुचिता, हमारी प्राथमिकता</p>
    </div>

    <div class="wallet-card">
        <div class="chip"></div>
        <div class="balance-label">Current Balance</div>
        <div class="balance-amt">₹<span id="uBalance">0.00</span></div>
        
        <div class="card-footer">
            <div>
                <div class="balance-label">Member Name</div>
                <div class="member-name" id="uNameDisp">Loading...</div>
            </div>
            <div class="expiry">
                VAL THRU<br><span id="uExpiry">--/--</span>
            </div>
        </div>
    </div>

    <div class="history-section">
        <div class="history-title">
            <h2>Transaction Log</h2>
            <span style="font-size: 0.8rem; color: #BF953F; font-weight: 700;">LIVE FEED</span>
        </div>
        
        <div id="logContainer" class="log-list">
            <p style="text-align: center; color: #999;">डेटा लोड किया जा रहा है...</p>
        </div>
    </div>

    <a href="index.html" class="back-btn">🏠 वापस होम पेज</a>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzlTe0mIbSAS1xxgy3imkn3M6AoR4HkCed-XHDy2lSln2j9kA74rBYoITi2iki90qdu/exec';

        window.onload = function() {
            const mobile = localStorage.getItem('userMobile');
            const name = localStorage.getItem('userName');
            document.getElementById('uNameDisp').innerText = name || "Valued Client";

            if(mobile) {
                // Member_DB से डेटा फेच करना
                fetch(`${scriptURL}?action=getMemberDetails&mobile=${mobile}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('uBalance').innerText = d.balance || "0.00";
                    document.getElementById('uExpiry').innerText = d.expiry || "12/26";
                    
                    const logs = d.transactionLog ? d.transactionLog.split('\n') : [];
                    let logHTML = '';
                    
                    logs.forEach(log => {
                        if(log.trim()) {
                            const isPlus = log.includes('+');
                            const icon = isPlus ? '💰' : '🧺';
                            const amtClass = isPlus ? 'plus' : '';
                            
                            logHTML += `
                                <div class="log-item">
                                    <div class="log-icon">${icon}</div>
                                    <div class="log-details">
                                        <div class="log-desc">${log}</div>
                                    </div>
                                </div>`;
                        }
                    });
                    
                    document.getElementById('logContainer').innerHTML = logHTML || '<p style="text-align:center;">कोई ट्रांजैक्शन नहीं मिला।</p>';
                })
                .catch(err => {
                    document.getElementById('logContainer').innerHTML = '<p style="text-align:center; color:red;">डेटा लोड करने में समस्या आई।</p>';
                });
            }
        };
    </script>
</body>
</html>
