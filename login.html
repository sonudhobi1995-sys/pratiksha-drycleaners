<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>पंजीकरण | PRATIKSHA COSMIC</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@300;400;700&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --star-gold: #FFD700;
            --deep-space: #010409;
            --moonlight: #f8fafc;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Inter', 'Mukta', sans-serif;
            background-color: var(--deep-space);
            color: var(--moonlight);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 200%;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 150px 150px, #fff, transparent),
                radial-gradient(2.5px 2.5px at 300px 50px, #fff, transparent);
            background-size: 300px 300px;
            animation: stars-stream 50s infinite linear;
            z-index: -1;
            opacity: 0.7;
        }

        @keyframes stars-stream {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .login-card { 
            background: var(--glass); 
            padding: 35px; 
            border-radius: 40px; 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-align: center; 
            width: 85%; 
            max-width: 380px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.5rem; 
            color: var(--star-gold); 
            margin-bottom: 5px; 
            display: block; 
            font-weight: 900; 
            letter-spacing: 3px;
        }

        h2 { font-family: 'Playfair Display', serif; color: var(--moonlight); margin: 0 0 10px 0; font-size: 1.4rem; letter-spacing: 1px; }
        p { color: #94a3b8; font-size: 0.8rem; margin-bottom: 25px; letter-spacing: 1px; }

        input { 
            width: 100%; padding: 15px; margin-bottom: 15px; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 18px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            background: rgba(0,0,0,0.5);
            color: white;
            outline: none; 
            transition: 0.3s; 
        }
        input:focus { border-color: var(--star-gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); }

        button { 
            width: 100%; padding: 18px; 
            background: linear-gradient(135deg, #FFD700, #FF8C00); 
            color: black; border: none; 
            border-radius: 20px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 1rem; 
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 20px rgba(255, 140, 0, 0.2); 
            transition: 0.3s; 
        }
        button:active { transform: scale(0.96); }
        button:disabled { background: #475569; color: #1e293b; }

        .footer-tag { font-size: 0.6rem; color: #475569; margin-top: 25px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="stars-container"></div>

    <div class="login-card">
        <span class="logo">प्रतीक्षा</span>
        <h2>नया पंजीकरण</h2>
        <p>डिजिटल साम्राज्य में आपका स्वागत है</p>
        
        <form id="regForm">
            <input type="text" id="userHouse" placeholder="🏠 मकान नंबर (जैसे: E-82)" required>
            <input type="text" id="userName" placeholder="👤 आपका शुभ नाम" required>
            <input type="tel" id="userMobile" placeholder="📱 मोबाइल नंबर (10 अंक)" pattern="[0-9]{10}" required title="कृपया 10 अंकों का नंबर डालें">
            <button type="submit" id="btn">प्रवेश करें ✨</button>
        </form>

        <div class="footer-tag">।। मिशन 2047: ऋणानुबंध ।।</div>
    </div>

    <script>
        // 🔱 PRATIKSHA DIGITAL - CHITTI SUPREME FINAL ASTRA URL
        const scriptURL = "https://script.google.com/macros/s/AKfycbx4VuHLbIRMNN68guX10VCWz5OBloN7I5NuFq-Be7EHROXAXWhczPEYxCXswgVal18Quw/exec";

        document.getElementById('regForm').onsubmit = function(e) {
            e.preventDefault();
            const house = document.getElementById('userHouse').value.trim();
            const name = document.getElementById('userName').value.trim();
            const mobile = document.getElementById('userMobile').value.trim();
            const btn = document.getElementById('btn');

            btn.innerText = "कोस्मिक सिंक जारी...";
            btn.disabled = true;

            // v12.0: 'Smart Overwrite' के लिए डेटा सिंक
            const finalURL = `${scriptURL}?action=addCustomer&mobile=${mobile}&name=${encodeURIComponent(name)}&houseNo=${encodeURIComponent(house)}`;

            // नो-कॉर्स मोड का उपयोग ताकि रिस्पांस की प्रतीक्षा किए बिना डेटा सुरक्षित रूप से पहुँच जाए
            fetch(finalURL, { mode: 'no-cors' })
            .then(() => {
                console.log("Chitti v12.0: Data Transmitted to Cosmic Engine");
            })
            .catch(err => console.log("Network handled via v12.0 Protocol"));

            // 1.5 सेकंड का ठहराव ताकि डेटाबेस अपडेट हो सके और यूजर को अहसास हो
            setTimeout(() => {
                localStorage.setItem('userHouse', house);
                localStorage.setItem('userName', name);
                localStorage.setItem('userMobile', mobile);
                localStorage.setItem('isLoggedIn', 'true');
                
                window.location.href = "index.html";
            }, 1500);
        };
    </script>
</body>
</html>
