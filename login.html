<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>पंजीकरण | प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ivory-canvas: #FAF7F2;
            --card-surface: #FFFFFF;
            --royal-navy: #13294B;
            --saffron-copper: #C86D2D;
            --antique-gold: #B48A2C;
            --emerald-seal: #1E6F50;
            --slate-ink: #3B4A62;
            --hairline-border: #E5DCCB;
            --soft-sand: #F3ECE0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Mukta', 'Inter', sans-serif;
            background-color: var(--ivory-canvas);
            background-image:
                radial-gradient(circle at 15% 12%, rgba(200, 109, 45, 0.07) 0%, transparent 42%),
                radial-gradient(circle at 85% 88%, rgba(19, 41, 75, 0.06) 0%, transparent 45%);
            color: var(--royal-navy);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .login-card {
            background: var(--card-surface);
            padding: 34px 28px;
            border-radius: 22px;
            border: 1.5px solid var(--hairline-border);
            border-top: 5px solid var(--saffron-copper);
            text-align: center;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 14px 34px rgba(19, 41, 75, 0.08);
        }

        .org-kicker {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--saffron-copper);
            background: var(--soft-sand);
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid var(--hairline-border);
            margin-bottom: 10px;
        }

        .logo {
            font-family: 'Playfair Display', 'Mukta', serif;
            font-size: 32px;
            color: var(--royal-navy);
            margin-bottom: 4px;
            display: block;
            font-weight: 900;
            letter-spacing: 1px;
        }

        h2 {
            font-family: 'Playfair Display', 'Mukta', serif;
            color: var(--saffron-copper);
            margin: 0 0 8px 0;
            font-size: 21px;
            font-weight: 900;
        }

        p.subtitle {
            color: var(--slate-ink);
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .field-group {
            text-align: left;
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--royal-navy);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid var(--hairline-border);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Mukta', 'Inter', sans-serif;
            background: var(--ivory-canvas);
            color: var(--royal-navy);
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        input:focus {
            border-color: var(--saffron-copper);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(200, 109, 45, 0.12);
        }

        button {
            width: 100%;
            padding: 15px 18px;
            margin-top: 8px;
            background: var(--royal-navy);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Mukta', 'Inter', sans-serif;
            cursor: pointer;
            font-size: 16px;
            letter-spacing: 0.6px;
            box-shadow: 0 8px 20px rgba(19, 41, 75, 0.16);
            transition: background 0.2s ease, transform 0.15s ease;
        }

        button:hover {
            background: var(--saffron-copper);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #94A3B8;
            color: #FFFFFF;
            cursor: not-allowed;
            box-shadow: none;
        }

        .footer-tag {
            font-size: 12px;
            font-weight: 700;
            color: var(--slate-ink);
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid var(--hairline-border);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <main class="login-card" aria-label="ग्राहक पंजीकरण">
        <div class="org-kicker">प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स • जयपुर, राजस्थान</div>
        <span class="logo">प्रतीक्षा</span>
        <h2>ग्राहक पंजीकरण व प्रवेश</h2>
        <p class="subtitle">शुचिता • सेवा • समर्पण — अपनी सेवाओं से जुड़ने के लिए विवरण दर्ज करें</p>

        <form id="regForm">
            <div class="field-group">
                <label for="userHouse">मकान / पता विवरण</label>
                <input type="text" id="userHouse" placeholder="जैसे: E-82 या गली/मोहल्ला" required>
            </div>

            <div class="field-group">
                <label for="userName">आपका शुभ नाम</label>
                <input type="text" id="userName" placeholder="पूरा नाम दर्ज करें" required>
            </div>

            <div class="field-group">
                <label for="userMobile">मोबाइल नंबर (10 अंक)</label>
                <input type="tel" id="userMobile" placeholder="10 अंकों का मोबाइल नंबर" pattern="[0-9]{10}" maxlength="10" required title="कृपया 10 अंकों का मोबाइल नंबर डालें">
            </div>

            <button type="submit" id="btn">प्रवेश करें</button>
        </form>

        <div class="footer-tag">प्रतीक्षा नीति ई-मित्र एंड ड्राई क्लीनर्स, जयपुर, राजस्थान</div>
    </main>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbxrvVW7RC6bxel3KVerx6AQb-Ool4BzrYAdbeQRbBXglZ7EV9N0l8uVQ-kcDJaXC__t/exec";

        function normalizeMobile(raw) {
            return (raw || "").toString().replace(/\D/g, "").slice(-10);
        }

        document.getElementById('regForm').onsubmit = function(e) {
            e.preventDefault();
            const house = document.getElementById('userHouse').value.trim();
            const name = document.getElementById('userName').value.trim();
            const mobile = normalizeMobile(document.getElementById('userMobile').value);
            const btn = document.getElementById('btn');

            if (!house || !name || mobile.length < 10) {
                alert("कृपया मकान/पता, शुभ नाम और सही 10 अंकों का मोबाइल नंबर दर्ज करें।");
                return;
            }

            btn.innerText = "सिंक हो रहा है...";
            btn.disabled = true;

            const finalURL = `${scriptURL}?action=addCustomer&mobile=${encodeURIComponent(mobile)}&name=${encodeURIComponent(name)}&houseNo=${encodeURIComponent(house)}`;

            fetch(finalURL, { mode: 'no-cors' })
                .then(() => {
                    console.log("Customer profile synced to backend");
                })
                .catch(err => console.log("Sync request dispatched:", err));

            setTimeout(() => {
                localStorage.setItem('userHouse', house);
                localStorage.setItem('userName', name);
                localStorage.setItem('userMobile', mobile);
                localStorage.setItem('isLoggedIn', 'true');

                window.location.href = "index.html";
            }, 1200);
        };
    </script>
</body>
</html>
