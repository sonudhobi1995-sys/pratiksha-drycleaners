<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardian Station | PRATIKSHA COSMIC PREMIERE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;700&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --moonlight: #f8fafc;
            --star-gold: #FFD700;
            --deep-space: #000205;
            --sun-orange: #FF8C00;
            --border-glow: rgba(255, 215, 0, 0.4);
        }

        body {
            font-family: 'Inter', 'Mukta', sans-serif;
            background-color: var(--deep-space);
            color: var(--moonlight);
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* 🪐 सौरमंडल एनीमेशन (आपकी मूल कोडिंग) */
        .solar-system {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
            opacity: 0.8;
        }

        .sun {
            position: absolute;
            top: 50%; left: 50%;
            width: 100px; height: 100px;
            background: radial-gradient(circle, #f39c12 20%, #e67e22 60%, transparent 80%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 60px 20px rgba(243, 156, 18, 0.5);
            animation: sun-pulse 4s infinite alternate;
        }

        @keyframes sun-pulse {
            from { box-shadow: 0 0 60px 20px rgba(243, 156, 18, 0.5); }
            to { box-shadow: 0 0 80px 30px rgba(243, 156, 18, 0.7); }
        }

        .orbit {
            position: absolute;
            top: 50%; left: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: orbit-rotate linear infinite;
        }

        @keyframes orbit-rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* नवग्रहों की कक्षाएँ */
        .orb-1 { width: 180px; height: 180px; animation-duration: 8s; }
        .planet-mercury { top: 10px; left: 50%; width: 8px; height: 8px; background: #95a5a6; border-radius: 50%; position: absolute; }
        .orb-2 { width: 280px; height: 280px; animation-duration: 15s; }
        .planet-venus { top: 20px; left: 20px; width: 12px; height: 12px; background: #f1c40f; border-radius: 50%; position: absolute; }
        .orb-3 { width: 400px; height: 400px; animation-duration: 25s; }
        .planet-earth { bottom: 30px; right: 30px; width: 14px; height: 14px; background: #3498db; border-radius: 50%; position: absolute; }
        .orb-4 { width: 550px; height: 550px; animation-duration: 40s; }
        .planet-mars { top: 50%; right: 10px; width: 10px; height: 10px; background: #e74c3c; border-radius: 50%; position: absolute; }

        /* ✨ सितारों का बहाव */
        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 200%;
            background-image: radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent), radial-gradient(2px 2px at 150px 150px, #fff, transparent);
            background-size: 300px 300px;
            animation: stars-stream 60s infinite linear;
            z-index: -3; opacity: 0.6;
        }
        @keyframes stars-stream { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        /* हैडर और कार्ड्स */
        .app-header { padding: 45px 20px 25px; text-align: center; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); border-bottom: 2px solid var(--sun-orange); }
        .container { padding: 20px; max-width: 500px; margin: auto; position: relative; z-index: 1; }
        
        .card { 
            background: rgba(255, 255, 255, 0.02); 
            padding: 25px; border-radius: 30px; margin-bottom: 20px; 
            border: 2px solid var(--border-glow);
            backdrop-filter: blur(8px);
        }
        
        h3 { color: var(--star-gold); font-family: 'Playfair Display', serif; border-bottom: 2px solid var(--sun-orange); display: inline-block; padding-bottom: 5px; text-transform: uppercase; font-size: 1.1rem; }
        label { font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.7); text-transform: uppercase; display: block; margin-top: 15px; }

        input, select { 
            width: 100%; padding: 16px; margin: 8px 0; border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.6); color: white; outline: none;
        }

        .btn-status { 
            width: 100%; padding: 18px; border: none; border-radius: 20px; 
            background: linear-gradient(135deg, var(--star-gold), var(--sun-orange)); 
            color: #000; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px;
        }

        .cog-dashboard-btn {
            background: none; border: 2px solid var(--star-gold); border-radius: 30px; padding: 20px;
            text-align: center; text-decoration: none; display: block; margin-bottom: 20px;
        }
        .cog-dashboard-btn img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--star-gold); margin-bottom: 10px; }

        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-nav { background: none; color: white; border: 1px solid rgba(255,255,255,0.3); padding: 15px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="stars-container no-print"></div>

    <div class="solar-system no-print">
        <div class="sun"></div>
        <div class="orbit orb-1"><div class="planet-mercury"></div></div>
        <div class="orbit orb-2"><div class="planet-venus"></div></div>
        <div class="orbit orb-3"><div class="planet-earth"></div></div>
        <div class="orbit orb-4"><div class="planet-mars"></div></div>
    </div>

    <div class="app-header">
        <h2 style="margin:0; font-family:'Playfair Display'; letter-spacing: 3px;">Guardian Station</h2>
        <div style="font-size: 0.6rem; color: var(--star-gold);">COSMIC COMMAND CENTER</div>
    </div>

    <div class="container">
        <!-- डैशबोर्ड लिंक -->
        <a href="Dashboard.html" class="cog-dashboard-btn">
            <img src="1000289866.jpg" alt="Dash">
            <div style="color: var(--star-gold); font-weight: 900;">प्रतीक्षा डिजिटल डैशबोर्ड</div>
        </a>

        <!-- क्विक सिग्नल कार्ड -->
        <div class="card">
            <h3>✨ QUICK SIGNAL</h3>
            <label>ग्राहक का नाम</label>
            <input type="text" id="custName" placeholder="नाम..." readonly style="color: var(--star-gold); font-weight: bold;">
            
            <div style="display: flex; gap: 10px;">
                <input type="tel" id="adminMobile" placeholder="मोबाइल नंबर" style="flex:1;">
                <button onclick="getContact('adminMobile', 'custName')" style="background:none; border:1.5px solid var(--star-gold); color:var(--star-gold); border-radius:12px; padding:0 15px;">👤</button>
            </div>
            
            <label>ऑर्डर स्थिति</label>
            <select id="adminStatus">
                <option value="Order Pickup">🚚 ऑर्डर पिकअप</option>
                <option value="Processing">🧺 प्रोसेसिंग (Laundry)</option>
                <option value="Ready to Deliver">✨ रेडी टू डिलीवर</option>
                <option value="Delivered">✅ डिलीवर्ड (Complete)</option>
            </select>

            <label>भुगतान माध्यम</label>
            <select id="paymentMode">
                <option value="Cash">💵 Cash</option>
                <option value="Online">📱 UPI</option>
                <option value="Wallet">💳 Wallet</option>
                <option value="Due">🔴 Due</option>
            </select>

            <button class="btn-status" id="updateBtn" onclick="updateStatusOnly()">सिग्नल सिंक करें</button>
        </div>

        <!-- 💳 वॉलेट रिचार्ज कार्ड (Astra v10.6 Power) -->
        <div class="card">
            <h3>💳 WALLET RECHARGE</h3>
            <label>ग्राहक मोबाइल</label>
            <div style="display: flex; gap: 10px;">
                <input type="tel" id="rechargeMobile" placeholder="नंबर..." style="flex:1;">
                <button onclick="getContact('rechargeMobile')" style="background:none; border:1.5px solid var(--star-gold); color:var(--star-gold); border-radius:12px; padding:0 15px;">👤</button>
            </div>
            <label>राशि (₹)</label>
            <input type="number" id="rechargeAmount" placeholder="1000" style="font-size: 1.5rem; text-align: center; color: var(--sun-orange); font-weight: 900;">
            <button class="btn-status" id="rechargeBtn" onclick="rechargeWallet()">खाते में पैसे जोड़ें</button>
        </div>

        <div class="card">
            <h3>🚀 NAVIGATION</h3>
            <div class="nav-grid">
                <button class="btn-nav" onclick="window.location.href='billing.html'">🧾 BILLING</button>
                <button class="btn-nav" onclick="window.location.href='driver-app.html'">🚚 DRIVER</button>
            </div>
        </div>
    </div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxPdPCSSv4BSjhXdGpTB0-Kx9r5NBphi8ygHHzVvrf72A6A_B0R5UlWPE3OMoDA8yb8Pw/exec';

    async function getContact(mobileId, nameId) {
        if (!('contacts' in navigator)) return alert("सपोर्ट नहीं है।");
        try {
            const contacts = await navigator.contacts.select(['name', 'tel'], {multiple: false});
            if (contacts.length > 0) {
                let rawNum = contacts[0].tel[0].replace(/\D/g, '').slice(-10);
                document.getElementById(mobileId).value = rawNum;
                if(nameId && contacts[0].name) document.getElementById(nameId).value = contacts[0].name[0];
            }
        } catch (err) {}
    }

    async function updateStatusOnly() {
        const mob = document.getElementById('adminMobile').value;
        const status = document.getElementById('adminStatus').value;
        const mode = document.getElementById('paymentMode').value;
        const btn = document.getElementById('updateBtn');
        if(!mob) return alert("नंबर भरें!");

        btn.innerText = "सिंक..."; btn.disabled = true;
        const url = `${scriptURL}?action=updateStatus&mobile=${mob}&status=${encodeURIComponent(status)}&paymentMode=${encodeURIComponent(mode)}`;
        
        try {
            await fetch(url, { mode: 'no-cors' });
            alert("सिग्नल सिंक सफल! ✅");
            window.open(`https://wa.me/91${mob}?text=${encodeURIComponent("*प्रतीक्षा ड्राईक्लीनर्स*\nस्थिति: " + status)}`, '_blank');
            location.reload();
        } catch (e) { alert("त्रुटि!"); btn.disabled = false; }
    }

    async function rechargeWallet() {
        const mob = document.getElementById('rechargeMobile').value;
        const amt = document.getElementById('rechargeAmount').value;
        const btn = document.getElementById('rechargeBtn');
        if(!mob || !amt) return alert("विवरण भरें!");

        btn.innerText = "प्रोसेस..."; btn.disabled = true;
        const url = `${scriptURL}?action=rechargeWallet&mobile=${mob}&amount=${amt}`;

        try {
            await fetch(url, { mode: 'no-cors' });
            alert("रिचार्ज सफल! ✅");
            window.open(`https://wa.me/91${mob}?text=${encodeURIComponent("*प्रतीक्षा ड्राईक्लीनर्स*\nआपका डिजिटल वॉलेट ₹" + amt + " से रिचार्ज हो गया है।")}`, '_blank');
            location.reload();
        } catch (e) { alert("त्रुटि!"); btn.disabled = false; }
    }
</script>
</body>
</html>
