<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardian Station | PRATIKSHA PREMIUM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;700&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --moonlight: #f8fafc;
            --star-gold: #FFD700;
            --deep-space: #010409;
            --sun-orange: #FF8C00;
            --glass: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(255, 215, 0, 0.15);
        }

        body {
            font-family: 'Inter', 'Mukta', sans-serif;
            background-color: var(--deep-space);
            color: var(--moonlight);
            margin: 0;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255,215,0,0.1), transparent 50%),
                radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 150px 150px, #fff, transparent);
            background-size: 100% 100%, 250px 250px, 350px 350px;
            background-attachment: fixed;
        }

        .app-header {
            padding: 50px 20px 30px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(2,6,23,0.9), transparent);
            border-bottom: 1px solid var(--border-glow);
        }

        .container { padding: 20px; max-width: 500px; margin: auto; }

        .cog-visual {
            background: var(--glass);
            border: 1px solid var(--border-glow);
            border-radius: 40px;
            padding: 40px 20px;
            margin-bottom: 30px;
            text-align: center;
            backdrop-filter: blur(20px);
        }

        .cog-visual img {
            width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid var(--star-gold); margin-bottom: 15px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
        }

        .card { 
            background: var(--glass); 
            padding: 30px 25px; border-radius: 35px; margin-bottom: 25px; 
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
        }
        
        h3 { color: var(--star-gold); font-family: 'Playfair Display', serif; letter-spacing: 3px; font-size: 0.9rem; text-transform: uppercase; }
        label { font-size: 0.65rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 5px; }

        input, select { 
            width: 100%; padding: 18px; margin: 10px 0 25px 0; 
            border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.5); color: white;
            box-sizing: border-box; font-size: 1rem;
        }

        .btn { 
            width: 100%; padding: 20px; border: none; border-radius: 22px; 
            font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: 0.4s; 
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-status { background: linear-gradient(135deg, #FFD700, #FF8C00); color: #000; }
        .btn-nav { background: rgba(255,255,255,0.03); color: var(--moonlight); border: 1px solid rgba(255,255,255,0.1); font-size: 0.7rem; }

        .footer-info { text-align: center; font-size: 10px; color: #4b5563; margin: 40px 0; letter-spacing: 2px; line-height: 2.5; font-weight: 700; }
    </style>
</head>
<body>

    <div class="app-header">
        <h2 style="margin:0; font-family:'Playfair Display', serif; letter-spacing: 4px; font-weight: 900; font-size: 1.8rem;">Guardian Station</h2>
        <div style="font-size: 0.65rem; color: var(--star-gold); margin-top: 10px; letter-spacing: 5px;">COMMAND CENTER</div>
    </div>

    <div class="container">
        <div class="cog-visual">
            <img src="1000289866.jpg" alt="CoG Vision">
            <div style="color: var(--star-gold); font-weight: 900; font-size: 0.9rem; letter-spacing: 4px;">CENTER OF GRAVITY</div>
            <p style="font-size: 0.65rem; opacity: 0.6; margin: 10px 0 0 0;">"ऋणानुबंध ही कर्म की धुरी है"</p>
        </div>

        <div class="card">
            <h3>✨ QUICK SIGNAL</h3>
            
            <label>ग्राहक संपर्क</label>
            <div style="display: flex; gap: 12px; margin: 12px 0 25px 0;">
                <input type="tel" id="adminMobile" placeholder="98XXXXXXXX" style="margin:0; flex:1;">
                <button type="button" onclick="getContact('adminMobile')" style="padding:0 20px; border-radius:18px; border:1px solid var(--star-gold); background:rgba(255,215,0,0.05); color:var(--star-gold); cursor:pointer;">👤</button>
            </div>
            
            <label>ऑर्डर की मुख्य प्रक्रिया</label>
            <select id="adminStatus">
                <option value="Order Pickup">🚚 ऑर्डर पिकअप (Pickup)</option>
                <option value="Processing">🧺 प्रोसेसिंग (Processing)</option>
                <option value="Ready to Deliver">✨ रेडी टू डिलीवर (Ready)</option>
                <option value="Delivered">✅ डिलीवर्ड (Delivered)</option>
            </select>

            <label>💰 दक्षिणा स्थिति</label>
            <select id="paymentStatus">
                <option value="Pending">🔴 उधारी (Pending)</option>
                <option value="Paid">🟢 प्राप्त (Paid)</option>
            </select>

            <button class="btn btn-status" id="updateBtn" onclick="updateStatusOnly()">
                सिग्नल सिंक करें
            </button>
        </div>

        <div class="card">
            <h3>🚀 NAVIGATION</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <button class="btn btn-nav" onclick="window.location.href='billing.html'">🧾 BILLING</button>
                <button class="btn btn-nav" onclick="window.location.href='Dashboard.html'">📊 INSIGHTS</button>
            </div>
        </div>
        
        <div class="footer-info">
            ।। मिशन 2047: प्रतीक्षा एवं नीति हेतु ।। <br>
            PREMIUM DIGITAL ECOSYSTEM © 2026
        </div>
    </div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxb3u12cCfzUGkKcd-mlIauxKRwjDBwJNKtglsIXVeRvxXxBXK1TosBSP93Dyq2TNIj/exec';

    async function getContact(mobileId) {
        if (!('contacts' in navigator)) return alert("Access Denied: Use Chrome on Android.");
        try {
            const props = ['tel'];
            const contacts = await navigator.contacts.select(props, {multiple: false});
            if (contacts.length > 0) {
                let rawNum = contacts[0].tel[0].replace(/\D/g, '').slice(-10);
                document.getElementById(mobileId).value = rawNum;
            }
        } catch (err) { console.log(err); }
    }

    function updateStatusOnly() {
        const mobile = document.getElementById('adminMobile').value;
        const status = document.getElementById('adminStatus').value;
        const pStatus = document.getElementById('paymentStatus').value;
        const btn = document.getElementById('updateBtn');
        
        if(!mobile || mobile.length < 10) return alert("सही मोबाइल नंबर डालें।");

        btn.innerText = "सिंक हो रहा है...";
        btn.disabled = true;

        const finalURL = `${scriptURL}?action=updateStatus&mobile=${mobile}&status=${encodeURIComponent(status)}&paymentStatus=${encodeURIComponent(pStatus)}`;
        
        fetch(finalURL, { method: 'GET', mode: 'no-cors' });

        setTimeout(() => {
            alert("सिग्नल सिंक हो गया! ✅");
            const payText = pStatus === "Paid" ? "✅ प्राप्त (Paid)" : "⏳ बकाया (Pending)";
            const waMsg = `*प्रतीक्षा ड्राईक्लीनर्स* 🧺✨\n--------------------------------\nऑर्डर स्थिति: *${status}*\nदक्षिणा: *${payText}*\n\n।। शुचिता ही संकल्प ।। 🙏`;
            window.open(`https://wa.me/91${mobile}?text=${encodeURIComponent(waMsg)}`, '_blank');
            location.reload();
        }, 1500);
    }
</script>
</body>
</html>
