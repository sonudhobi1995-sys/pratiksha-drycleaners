<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardian Station | PRATIKSHA COSMIC PREMIERE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;700&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --moonlight: #f8fafc;
            --star-gold: #FFD700;
            --deep-space: #010409;
            --glass: rgba(255, 255, 255, 0.04);
            --border-glow: rgba(255, 215, 0, 0.25);
        }

        body {
            font-family: 'Inter', 'Mukta', sans-serif;
            background-color: var(--deep-space);
            color: var(--moonlight);
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* ✨ 1. कोस्मिक बैकग्राउंड: बहते हुए घने और चमकदार तारे */
        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 200%;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 150px 150px, #fff, transparent),
                radial-gradient(2.5px 2.5px at 300px 50px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 50px 300px, #fff, transparent),
                radial-gradient(2px 2px at 400px 250px, #fff, transparent);
            background-size: 300px 300px;
            animation: stars-stream 45s infinite linear;
            z-index: -2;
            opacity: 0.85;
        }

        @keyframes stars-stream {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* 🌙 2. पवित्र चंद्रमा (Divine Moon) */
        .moon {
            position: absolute;
            top: -60px; left: -60px; width: 180px; height: 180px;
            background: radial-gradient(circle at 70% 30%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.1) 60%, transparent 75%);
            border-radius: 50%;
            box-shadow: 0 0 80px rgba(255, 255, 255, 0.2);
            z-index: -1;
        }

        .app-header {
            padding: 45px 20px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-glow);
            background: linear-gradient(to bottom, rgba(1, 4, 9, 0.9), transparent);
        }
        
        .app-logo {
            width: 75px; height: 75px; border-radius: 50%;
            background: white; padding: 3px; margin-bottom: 15px;
            border: 2px solid var(--star-gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .container { 
            padding: 20px; max-width: 500px; margin: auto; 
            position: relative; z-index: 1; 
            height: calc(100vh - 120px); overflow-y: auto;
        }

        /* 💎 PREMIUM DASHBOARD BUTTON (Replacement for Center of Gravity) */
        .cog-dashboard-btn {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,255,255,0.05));
            border: 1px solid var(--star-gold);
            border-radius: 45px;
            padding: 35px 20px;
            margin-bottom: 30px;
            text-align: center;
            backdrop-filter: blur(25px);
            cursor: pointer;
            transition: 0.4s;
            display: block;
            text-decoration: none;
            box-shadow: inset 0 0 30px rgba(255,215,0,0.1);
        }

        .cog-dashboard-btn:active { transform: scale(0.97); }

        .cog-dashboard-btn img {
            width: 95px; height: 95px; border-radius: 50%;
            border: 2px solid var(--star-gold); margin-bottom: 15px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
            animation: cosmic-float 6s infinite ease-in-out;
        }

        @keyframes cosmic-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .card { 
            background: var(--glass); 
            padding: 28px; border-radius: 38px; margin-bottom: 25px; 
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        
        h3 { color: var(--star-gold); font-family: 'Playfair Display', serif; margin-top: 0; letter-spacing: 3px; font-size: 0.95rem; text-transform: uppercase; }
        label { font-size: 0.65rem; font-weight: 700; color: #8a99af; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 8px; }

        input, select { 
            width: 100%; padding: 18px; margin: 8px 0 25px 0; 
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); 
            background: rgba(0,0,0,0.7); color: white; font-size: 1rem;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--star-gold); }

        .btn { 
            width: 100%; padding: 20px; border: none; border-radius: 25px; 
            font-weight: 900; font-size: 0.9rem; cursor: pointer; transition: 0.4s; 
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-status { background: linear-gradient(135deg, #FFD700, #FF8C00); color: #000; box-shadow: 0 12px 25px rgba(255, 140, 0, 0.3); }
        
        /* 🚀 NAVIGATION MENU */
        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-nav { background: rgba(255,255,255,0.05); color: var(--moonlight); border: 1px solid rgba(255,255,255,0.12); font-size: 0.75rem; }
        .btn-full { grid-column: span 2; margin-top: 8px; border: 1px dashed var(--star-gold); color: var(--star-gold); background: rgba(255,215,0,0.05); }

        .footer-info { text-align: center; font-size: 10px; color: #64748b; margin: 45px 0; font-weight: 700; letter-spacing: 2px; line-height: 2; }
    </style>
</head>
<body>

    <div class="stars-container"></div>
    <div class="moon"></div>

    <div class="app-header">
        <img src="logo.png" alt="PRATIKSHA" class="app-logo">
        <h2 style="margin:0; font-family:'Playfair Display', serif; letter-spacing: 5px; font-weight: 900; font-size: 1.6rem;">Guardian Station</h2>
        <div style="font-size: 0.6rem; color: var(--star-gold); margin-top: 8px; letter-spacing: 4px;">COSMIC COMMAND CENTER</div>
    </div>

    <div class="container">
        
        <a href="Dashboard.html" class="cog-dashboard-btn">
            <img src="1000289866.jpg" alt="Dash Vision">
            <div style="color: var(--star-gold); font-weight: 900; font-size: 1rem; letter-spacing: 3px;">प्रतीक्षा डिजिटल डैशबोर्ड</div>
            <p style="font-size: 0.65rem; color: #fff; opacity: 0.7; margin: 10px 0 0 0; letter-spacing: 2px;">क्लिक करें और प्रगति देखें</p>
        </a>

        <div class="card">
            <h3>✨ QUICK SIGNAL</h3>
            
            <label>ग्राहक का नाम</label>
            <input type="text" id="custName" placeholder="कॉन्टैक्ट चुनने पर नाम यहाँ आएगा..." readonly style="background: rgba(255,255,255,0.03); color: #FFD700; font-weight: 700;">

            <label>ग्राहक संपर्क</label>
            <div style="display: flex; gap: 12px; margin-bottom: 25px;">
                <input type="tel" id="adminMobile" placeholder="98XXXXXXXX" style="margin:0; flex:1;">
                <button type="button" onclick="getContact()" style="padding:0 20px; border-radius:20px; border:1px solid var(--star-gold); background:rgba(255,215,0,0.05); color:var(--star-gold); cursor:pointer; font-size: 1.2rem;">👤</button>
            </div>
            
            <label>ऑर्डर प्रक्रिया चरण</label>
            <select id="adminStatus">
                <option value="Order Pickup">🚚 ऑर्डर पिकअप (Field)</option>
                <option value="Processing">🧺 प्रोसेसिंग (Laundry)</option>
                <option value="Ready to Deliver">✨ रेडी टू डिलीवर (Ready)</option>
                <option value="Delivered">✅ डिलीवर्ड (Complete)</option>
            </select>

            <label>💰 भुगतान मार्ग (Payment Mode)</label>
            <select id="paymentMode">
                <option value="Cash">💵 नकद (Cash)</option>
                <option value="Online">📱 डिजिटल (UPI)</option>
                <option value="Wallet">💳 सदस्यता (Wallet)</option>
                <option value="Due">🔴 उधारी (Due)</option>
            </select>

            <button class="btn btn-status" id="updateBtn" onclick="updateStatusOnly()">
                सिग्नल सिंक करें
            </button>
        </div>

        <div class="card">
            <h3>🚀 QUICK NAVIGATION</h3>
            <div class="nav-grid">
                <button class="btn btn-nav" onclick="window.location.href='billing.html'">🧾 BILLING</button>
                <button class="btn btn-nav" onclick="window.location.href='driver-app.html'">🚚 DRIVER APP</button>
                <button class="btn btn-nav btn-full" onclick="window.location.href='Member_Exclusive.html'">💳 MEMBER INSIGHTS & RECORDS</button>
            </div>
        </div>
        
        <div class="footer-info">
            ।। मिशन 2047: प्रतीक्षा एवं नीति हेतु ।। <br>
            SONU NEEL संचालित रूहानी तंत्र © 2026
        </div>
    </div>

<script>
    // Astra v10 Engine Sync URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxb3u12cCfzUGkKcd-mlIauxKRwjDBwJNKtglsIXVeRvxXxBXK1TosBSP93Dyq2TNIj/exec';

    // 👤 कांटेक्ट लिस्ट से नाम और नंबर उठाना
    async function getContact() {
        if (!('contacts' in navigator)) return alert("क्षमा करें, यह केवल Android Chrome पर काम करता है।");
        try {
            const props = ['name', 'tel'];
            const contacts = await navigator.contacts.select(props, {multiple: false});
            if (contacts.length > 0) {
                const contact = contacts[0];
                if (contact.name) document.getElementById('custName').value = contact.name[0];
                if (contact.tel) {
                    let rawNum = contact.tel[0].replace(/\D/g, '');
                    document.getElementById('adminMobile').value = rawNum.slice(-10);
                }
            }
        } catch (err) { console.error(err); }
    }

    // 🚀 डेटा अपडेट और व्हाट्सएप ट्रिगर
    function updateStatusOnly() {
        const mobile = document.getElementById('adminMobile').value;
        const name = document.getElementById('custName').value;
        const status = document.getElementById('adminStatus').value;
        const pMode = document.getElementById('paymentMode').value;
        const btn = document.getElementById('updateBtn');
        
        if(!mobile || mobile.length < 10) return alert("कृपया सही मोबाइल नंबर दर्ज करें।");

        btn.innerText = "कोस्मिक सिंक जारी...";
        btn.disabled = true;

        // Astra v10 Logic: Due means Pending, others mean Paid
        const pStatus = (pMode === "Due") ? "Pending" : "Paid";
        const finalURL = `${scriptURL}?action=updateStatus&mobile=${mobile}&status=${encodeURIComponent(status)}&paymentStatus=${pStatus}&paymentMode=${encodeURIComponent(pMode)}`;
        
        fetch(finalURL, { method: 'GET', mode: 'no-cors' });

        setTimeout(() => {
            alert("कोस्मिक सिग्नल सिंक हो गया! ✅");
            let payMsg = (pMode === "Due") ? "⏳ उधारी (Due)" : `✅ प्राप्त (${pMode})`;
            
            // व्हाट्सएप संदेश (Personalized with Name)
            const waMsg = `*प्रतीक्षा ड्राईक्लीनर्स* 🧺✨\n--------------------------------\nनमस्ते *${name || 'ग्राहक जी'}*,\n\nआपके ऑर्डर की वर्तमान स्थिति: *${status}*\nदक्षिणा स्थिति: *${payMsg}*\n\n।। ऋणानुबंध ही कर्म की धुरी है ।। 🙏`;
            
            window.open(`https://wa.me/91${mobile}?text=${encodeURIComponent(waMsg)}`, '_blank');
            location.reload();
        }, 1500);
    }
</script>
</body>
</html>
